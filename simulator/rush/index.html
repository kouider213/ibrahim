<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RUSH">
<meta name="theme-color" content="#120a24">
<link rel="manifest" href="/ibrahim/rush-manifest.json">
<link rel="apple-touch-icon" href="/ibrahim/icons/rush-512.png">
<link rel="icon" href="/ibrahim/icons/rush-512.png">
<title>RUSH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Inter:wght@500;700;800;900&family=Cairo:wght@600;800;900&display=swap">
<style>
:root { --ink: #fff; --gold: #ffc93c; --hot: #ff3d6e; --cyan: #22d3ee; --violet: #8b5cf6; --glass: rgba(14, 10, 32, .55); --line: rgba(255,255,255,.16);
  --display: "Lilita One", Impact, sans-serif; --ui: "Inter", system-ui, sans-serif; --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #120a24; color: var(--ink); font-family: var(--ui); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; overscroll-behavior: none; }
html[dir=rtl] body, html[dir=rtl] button { font-family: "Cairo", var(--ui); }
[hidden] { display: none !important; }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.layer { position: fixed; inset: 0; z-index: 3; display: flex; flex-direction: column; pointer-events: none; }
.layer > * { pointer-events: auto; }
.glass { background: var(--glass); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4); border: 1px solid var(--line); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 58px; padding: 0 24px; border-radius: 20px; font-family: var(--display); font-size: 24px; letter-spacing: .5px; color: #2a1600;
  background: linear-gradient(180deg, #ffe27a, #ffb21e 55%, #ff9800); box-shadow: 0 6px 0 #c76a00, 0 14px 30px rgba(255,150,0,.35), inset 0 2px 0 rgba(255,255,255,.7); transition: transform .08s; text-shadow: 0 1px 0 rgba(255,255,255,.5); }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c76a00, 0 6px 16px rgba(255,150,0,.3), inset 0 2px 0 rgba(255,255,255,.7); }
.btn.alt { color: #fff; background: linear-gradient(180deg, #a78bfa, #7c3aed); box-shadow: 0 6px 0 #4c1d95, 0 14px 30px rgba(124,58,237,.35), inset 0 2px 0 rgba(255,255,255,.4); text-shadow: 0 2px 0 rgba(0,0,0,.25); }
.btn.alt:active { box-shadow: 0 2px 0 #4c1d95; }
.btn.pink { color: #fff; background: linear-gradient(180deg, #ff7aa2, #ff2d6f); box-shadow: 0 6px 0 #a3123f, 0 14px 30px rgba(255,45,111,.35), inset 0 2px 0 rgba(255,255,255,.4); text-shadow: 0 2px 0 rgba(0,0,0,.2); }
.btn.pink:active { box-shadow: 0 2px 0 #a3123f; }
.btn.ghost { color: #fff; background: rgba(255,255,255,.12); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.3); font-size: 19px; min-height: 50px; }
.btn.small { min-height: 44px; font-size: 18px; padding: 0 16px; border-radius: 14px; }
.icon-btn { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; font-size: 22px; }

/* MENU */
#menu { justify-content: space-between; padding: calc(var(--st) + 12px) 16px calc(var(--sb) + 16px); background: linear-gradient(180deg, rgba(8,4,20,.55) 0%, rgba(8,4,20,0) 30%, rgba(8,4,20,0) 52%, rgba(8,4,20,.82) 100%); }
.top-row { display: flex; align-items: center; gap: 8px; }
.wallet { display: flex; align-items: center; gap: 6px; padding: 7px 12px 7px 8px; border-radius: 999px; font-weight: 900; font-size: 16px; }
.coin-ico { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3b0, #ffc93c 45%, #c98300); box-shadow: inset 0 -2px 0 rgba(0,0,0,.2), 0 0 10px rgba(255,201,60,.6); display: inline-block; flex: none; }
.logo { text-align: center; margin-top: 4px; }
.logo h1 { margin: 0; font-family: var(--display); font-size: clamp(64px, 22vw, 120px); line-height: .9; letter-spacing: 2px; transform: skewX(-8deg); color: #fff;
  background: linear-gradient(180deg, #fff 0%, #ffe27a 45%, #ff8a00 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 5px 0 #8a2be2) drop-shadow(0 10px 22px rgba(255,61,110,.55)); }
.logo .sub { font-family: var(--display); font-size: 17px; letter-spacing: 3px; color: #ffd7f0; text-shadow: 0 2px 10px rgba(255,61,110,.8); margin-top: 4px; }
.duel { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; border-radius: 22px; padding: 10px 12px; margin: 10px auto 0; max-width: 420px; width: 100%; }
.duel .p { text-align: center; }
.duel .n { font-weight: 900; font-size: 13px; opacity: .85; text-transform: uppercase; letter-spacing: 1px; }
.duel .v { font-family: var(--display); font-size: 26px; }
.duel .k .v { color: #ff8fa3; } .duel .f .v { color: #c4b5fd; }
.duel .vs { font-family: var(--display); font-size: 20px; color: var(--gold); }
.duel .lead { font-size: 11px; font-weight: 800; color: var(--gold); }
.invite { margin: 10px auto 0; max-width: 420px; width: 100%; border-radius: 20px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; background: linear-gradient(135deg, rgba(255,45,111,.85), rgba(139,92,246,.85)); box-shadow: 0 10px 30px rgba(255,45,111,.4); animation: pulse 1.4s ease-in-out infinite; }
.invite b { flex: 1; font-size: 15px; }
@keyframes pulse { 50% { transform: scale(1.03); } }
.picker { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 10px; }
.picker .name { min-width: 170px; text-align: center; font-family: var(--display); font-size: 24px; text-shadow: 0 3px 12px rgba(0,0,0,.6); }
.picker .price { font-family: var(--ui); font-weight: 800; font-size: 13px; color: var(--gold); display: flex; align-items: center; justify-content: center; gap: 4px; }
.arrow { width: 50px; height: 50px; border-radius: 25px; font-size: 22px; display: grid; place-items: center; }
.word { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; }
.word span { width: 30px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-family: var(--display); font-size: 19px; background: rgba(255,255,255,.1); color: rgba(255,255,255,.35); border: 1px solid var(--line); }
.word span.got { background: linear-gradient(180deg, #ffe27a, #ff9800); color: #5a2a00; border-color: transparent; box-shadow: 0 0 14px rgba(255,180,0,.6); }
.word small { align-self: center; font-size: 12px; font-weight: 800; opacity: .8; margin-inline-start: 6px; }
.menu-main { display: grid; gap: 12px; max-width: 420px; width: 100%; margin: 0 auto; }
.menu-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.tile { border-radius: 18px; padding: 10px 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-weight: 800; font-size: 12.5px; position: relative; }
.tile .e { font-size: 26px; }
.dot { position: absolute; top: 6px; right: 10px; width: 10px; height: 10px; border-radius: 5px; background: var(--hot); box-shadow: 0 0 8px var(--hot); }

/* HUD */
#hud { padding: calc(var(--st) + 10px) 12px 0; pointer-events: none; }
#hud > * { pointer-events: none; }
.hud-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.score { font-family: var(--display); font-size: 40px; line-height: 1; text-shadow: 0 3px 0 rgba(0,0,0,.35), 0 0 18px rgba(0,0,0,.4); font-variant-numeric: tabular-nums; }
.mult { display: inline-block; margin-top: 4px; padding: 3px 10px; border-radius: 10px; font-family: var(--display); font-size: 18px; background: linear-gradient(180deg, #ff7aa2, #ff2d6f); box-shadow: 0 3px 0 #a3123f; }
.mult.x2 { background: linear-gradient(180deg, #ffe27a, #ff9800); color: #4a2000; box-shadow: 0 3px 0 #c76a00, 0 0 16px rgba(255,180,0,.8); }
.hud-coins { display: flex; align-items: center; gap: 6px; font-family: var(--display); font-size: 26px; padding: 6px 12px 6px 8px; border-radius: 999px; }
.pause-btn { pointer-events: auto !important; width: 46px; height: 46px; border-radius: 15px; font-size: 20px; }
.pows { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; align-items: flex-start; }
.pow { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px; border-radius: 999px; font-weight: 900; font-size: 13px; }
.pow i { font-style: normal; width: 30px; height: 30px; border-radius: 15px; display: grid; place-items: center; background: rgba(255,255,255,.18); }
.pow .bar { width: 70px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.2); overflow: hidden; }
.pow .bar b { display: block; height: 100%; background: linear-gradient(90deg, #22d3ee, #a3e635); border-radius: 4px; }
.duo-bar { margin: 10px auto 0; width: min(420px, 100%); border-radius: 16px; padding: 8px 12px; display: grid; gap: 6px; }
.duo-line { display: grid; grid-template-columns: 74px 1fr 70px; align-items: center; gap: 8px; font-weight: 900; font-size: 12.5px; }
.duo-line .track { height: 8px; border-radius: 4px; background: rgba(255,255,255,.15); position: relative; overflow: hidden; }
.duo-line .track b { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }
.duo-line .sc { text-align: end; font-variant-numeric: tabular-nums; }
.toast { position: fixed; left: 50%; top: 32%; transform: translate(-50%, -50%); z-index: 6; text-align: center; pointer-events: none; font-family: var(--display); font-size: clamp(30px, 9vw, 52px); text-shadow: 0 4px 0 rgba(0,0,0,.35), 0 0 30px rgba(255,61,110,.7); animation: pop 1.6s ease-out forwards; white-space: nowrap; }
.toast small { display: block; font-family: var(--ui); font-weight: 800; font-size: 15px; letter-spacing: 3px; text-transform: uppercase; color: #ffe27a; }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.5); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); } 25% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -70%) scale(1); } }
.count { position: fixed; inset: 0; z-index: 7; display: grid; place-items: center; pointer-events: none; font-family: var(--display); font-size: 140px; text-shadow: 0 8px 0 rgba(0,0,0,.3), 0 0 50px rgba(255,201,60,.8); color: #ffe27a; }
.count.go { color: #a3e635; }
.vignette { position: fixed; inset: 0; z-index: 2; pointer-events: none; box-shadow: inset 0 0 120px 30px rgba(255,0,60,.0); transition: box-shadow .2s; }
.vignette.on { box-shadow: inset 0 0 140px 40px rgba(255,0,60,.55); }
.flash { position: fixed; inset: 0; z-index: 5; pointer-events: none; background: #fff; opacity: 0; transition: opacity .35s; }
.board-btn { position: fixed; right: 14px; bottom: calc(var(--sb) + 18px); z-index: 4; width: 66px; height: 66px; border-radius: 33px; font-size: 30px; display: grid; place-items: center; pointer-events: auto; }
.board-btn b { position: absolute; top: -4px; right: -4px; min-width: 24px; height: 24px; border-radius: 12px; background: var(--hot); font-size: 13px; display: grid; place-items: center; padding: 0 6px; }
.hint { position: fixed; left: 0; right: 0; bottom: calc(var(--sb) + 110px); z-index: 4; text-align: center; font-weight: 800; font-size: 15px; opacity: .9; pointer-events: none; text-shadow: 0 2px 8px rgba(0,0,0,.6); animation: fade 4s forwards; }
@keyframes fade { 75% { opacity: .9; } 100% { opacity: 0; } }

/* Panneaux (pause, fin, boutique, missions, salle à deux) */
.sheet { position: fixed; inset: 0; z-index: 8; display: flex; align-items: flex-end; justify-content: center; background: rgba(6,3,16,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.sheet .card { width: min(480px, 100%); max-height: 92dvh; overflow-y: auto; border-radius: 28px 28px 0 0; padding: 20px 16px calc(var(--sb) + 18px); background: linear-gradient(180deg, #23164a, #140c2c); border: 1px solid var(--line); border-bottom: 0; box-shadow: 0 -20px 60px rgba(0,0,0,.5); animation: up .35s cubic-bezier(.2,1.2,.4,1); }
@media (min-height: 700px) and (min-width: 600px) { .sheet { align-items: center; } .sheet .card { border-radius: 28px; border-bottom: 1px solid var(--line); } }
@keyframes up { from { transform: translateY(60px); opacity: 0; } }
.card h2 { margin: 0 0 4px; font-family: var(--display); font-size: 32px; text-align: center; }
.card .lead { text-align: center; opacity: .75; font-weight: 600; font-size: 14px; margin-bottom: 14px; }
.big-score { text-align: center; font-family: var(--display); font-size: 64px; line-height: 1; background: linear-gradient(180deg, #fff, #ffe27a 60%, #ff9800); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 4px 0 #6d28d9); }
.record { text-align: center; margin: 6px 0 2px; font-family: var(--display); font-size: 22px; color: #a3e635; animation: pulse 1s infinite; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.stat { border-radius: 16px; padding: 10px 6px; text-align: center; background: rgba(255,255,255,.07); border: 1px solid var(--line); }
.stat b { display: block; font-family: var(--display); font-size: 22px; }
.stat span { font-size: 11.5px; font-weight: 700; opacity: .7; }
.stack { display: grid; gap: 10px; }
.mission { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 18px; background: rgba(255,255,255,.07); border: 1px solid var(--line); margin-bottom: 8px; }
.mission .e { font-size: 26px; width: 40px; text-align: center; }
.mission .t { flex: 1; font-weight: 700; font-size: 14px; }
.mission .bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,.14); margin-top: 6px; overflow: hidden; }
.mission .bar b { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #ff2d6f, #ffc93c); }
.mission.done { border-color: rgba(163,230,53,.6); background: rgba(163,230,53,.12); }
.mission.done .bar b { background: #a3e635; }
.shop-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.shop-tabs button { flex: 1; padding: 10px 4px; border-radius: 14px; font-weight: 800; font-size: 13.5px; background: rgba(255,255,255,.08); }
.shop-tabs button.on { background: linear-gradient(180deg, #a78bfa, #7c3aed); }
.shop-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 18px; background: rgba(255,255,255,.07); border: 1px solid var(--line); margin-bottom: 8px; }
.shop-item .sw { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 26px; flex: none; }
.shop-item .t { flex: 1; } .shop-item .t b { display: block; font-size: 15px; } .shop-item .t span { font-size: 12.5px; opacity: .7; }
.lv { display: flex; gap: 3px; margin-top: 5px; } .lv i { width: 16px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18); } .lv i.on { background: #22d3ee; box-shadow: 0 0 6px #22d3ee; }
.lobby-p { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0 16px; }
.lobby-p > div { border-radius: 20px; padding: 16px 10px; text-align: center; background: rgba(255,255,255,.07); border: 1.5px solid var(--line); }
.lobby-p .av { width: 64px; height: 64px; border-radius: 32px; margin: 0 auto 8px; display: grid; place-items: center; font-family: var(--display); font-size: 30px; }
.lobby-p .st { font-weight: 800; font-size: 13px; margin-top: 4px; }
.lobby-p .ok { border-color: #a3e635; box-shadow: 0 0 20px rgba(163,230,53,.3); }
.winner { text-align: center; font-family: var(--display); font-size: 40px; color: #ffe27a; text-shadow: 0 0 30px rgba(255,201,60,.8); margin: 4px 0 10px; }
.vs-table { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
.vs-table > div { border-radius: 18px; padding: 14px 8px; text-align: center; background: rgba(255,255,255,.07); border: 1px solid var(--line); }
.vs-table .win { border-color: #ffc93c; background: rgba(255,201,60,.14); }
.vs-table b { display: block; font-family: var(--display); font-size: 28px; }
.revive-ring { width: 120px; height: 120px; margin: 6px auto 12px; border-radius: 60px; display: grid; place-items: center; font-family: var(--display); font-size: 44px; background: conic-gradient(#ffc93c var(--p, 100%), rgba(255,255,255,.12) 0); }
.revive-ring span { width: 100px; height: 100px; border-radius: 50px; background: #1d1240; display: grid; place-items: center; }
.loading { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #3b1c6e, #120a24); transition: opacity .5s; }
.loading h1 { font-family: var(--display); font-size: 80px; margin: 0; transform: skewX(-8deg); background: linear-gradient(180deg, #fff, #ffe27a 50%, #ff8a00); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.loading .bar { width: 180px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.15); overflow: hidden; margin: 10px auto 0; }
.loading .bar b { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, #ff2d6f, #ffc93c); animation: load 1s ease-in-out infinite; }
@keyframes load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
.confetti { position: fixed; inset: 0; z-index: 9; pointer-events: none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="vignette" id="vig"></div>
<div class="flash" id="flash"></div>
<div class="loading" id="loading"><div style="text-align:center"><h1>RUSH</h1><div class="bar"><b></b></div></div></div>

<div class="layer" id="menu" hidden>
  <div>
    <div class="top-row">
      <div class="wallet glass"><span class="coin-ico"></span><span id="mCoins">0</span></div>
      <div class="wallet glass" title="hoverboards">🛹 <span id="mBoards">0</span></div>
      <div style="flex:1"></div>
      <button class="icon-btn glass" id="bLang">ع</button>
      <button class="icon-btn glass" id="bSound">🔊</button>
      <button class="icon-btn glass" id="bExit" hidden>✕</button>
    </div>
    <div class="logo"><h1>RUSH</h1><div class="sub" data-t="tagline">KOUIDER ✦ FATIMA</div></div>
    <div class="duel glass" id="duel" hidden>
      <div class="p k"><div class="n" id="dKn">Kouider</div><div class="v" id="dKv">0</div><div class="lead" id="dKl"></div></div>
      <div class="vs">VS</div>
      <div class="p f"><div class="n" id="dFn">Fatima</div><div class="v" id="dFv">0</div><div class="lead" id="dFl"></div></div>
    </div>
    <div class="invite" id="invite" hidden><span style="font-size:30px">🎮</span><b id="inviteTxt"></b><button class="btn small" id="bJoin" data-t="join">Rejoindre</button></div>
  </div>
  <div>
    <div class="word" id="word"></div>
    <div class="picker">
      <button class="arrow glass" id="bPrev">‹</button>
      <div><div class="name" id="lookName">Kouider</div><div class="price" id="lookPrice"></div></div>
      <button class="arrow glass" id="bNext">›</button>
    </div>
    <div class="menu-main">
      <button class="btn" id="bPlay"><span data-t="play">JOUER</span> ▶</button>
      <button class="btn pink" id="bDuo">👫 <span data-t="duo">À DEUX</span></button>
      <div class="menu-row">
        <button class="tile glass" id="bMissions"><span class="e">🎯</span><span data-t="missions">Missions</span><span class="dot" id="mDot" hidden></span></button>
        <button class="tile glass" id="bShop"><span class="e">🛍️</span><span data-t="shop">Boutique</span></button>
        <button class="tile glass" id="bHelp"><span class="e">❔</span><span data-t="how">Comment jouer</span></button>
      </div>
    </div>
  </div>
</div>

<div class="layer" id="hud" hidden>
  <div class="hud-row">
    <div>
      <div class="score" id="hScore">0</div>
      <div class="mult" id="hMult">×1</div>
      <div class="pows" id="hPows"></div>
    </div>
    <div style="display:flex; gap:8px; align-items:center">
      <div class="hud-coins glass"><span class="coin-ico"></span><span id="hCoins">0</span></div>
      <button class="pause-btn glass" id="bPause">❚❚</button>
    </div>
  </div>
  <div class="duo-bar glass" id="hDuo" hidden></div>
</div>
<button class="board-btn glass" id="bBoard" hidden>🛹<b id="hBoards">0</b></button>
<div id="toasts"></div>
<canvas class="confetti" id="confetti"></canvas>
<div id="sheet"></div>
<script type="module" src="../src/rush/main.ts"></script>
</body>
</html>
