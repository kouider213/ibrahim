<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS — Fik Conciergerie</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#05060f;--panel:rgba(14,18,36,.72);--line:rgba(120,170,255,.14);
  --text:#e6edff;--dim:#8a97b8;--faint:#55607e;
  --cyan:#22d3ee;--green:#34d399;--violet:#a78bfa;--amber:#fbbf24;--red:#f87171;
  --r:14px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 50% at 50% 38%,rgba(34,211,238,.10),transparent 70%),
             radial-gradient(ellipse 40% 40% at 90% 100%,rgba(167,139,250,.08),transparent 70%)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

.app{position:relative;height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:12px;padding:14px 18px}

/* ── Barre du haut ── */
header{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:baseline;gap:12px}
.brand b{font-size:18px;letter-spacing:.42em;font-weight:700;color:var(--cyan)}
.brand span{font-size:11px;letter-spacing:.18em;color:var(--faint);text-transform:uppercase}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);font-size:11px;letter-spacing:.08em;color:var(--dim)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.chip.on i{background:var(--green);box-shadow:0 0 8px var(--green)}
.chip.off i{background:var(--red);box-shadow:0 0 8px var(--red)}
#clock{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;min-width:64px;text-align:right}

/* ── Zone principale : conversation | orbe | outils ── */
main{display:grid;grid-template-columns:minmax(260px,1fr) minmax(340px,1.15fr) minmax(260px,1fr);gap:14px;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  backdrop-filter:blur(14px);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.card h2{font-size:10px;letter-spacing:.22em;color:var(--faint);font-weight:600;padding:12px 16px 8px;text-transform:uppercase}

/* Conversation */
#chat{flex:1;overflow-y:auto;padding:4px 14px 14px;display:flex;flex-direction:column;gap:9px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.msg{max-width:92%;padding:9px 12px;border-radius:12px;line-height:1.5;font-size:13px;word-break:break-word;white-space:pre-wrap}
.msg.nexus{background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.18);align-self:flex-start}
.msg.user{background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.25);align-self:flex-end}
.empty{margin:auto;text-align:center;color:var(--faint);font-size:12px;line-height:1.7;padding:20px}

/* Orbe */
.stage{align-items:center;justify-content:center;gap:6px;padding:14px}
#orbWrap{position:relative;width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#orb{max-width:100%;max-height:100%;aspect-ratio:1}
#phase{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--cyan);transition:color .4s}
#sub{font-size:12px;color:var(--dim);min-height:18px;text-align:center;padding:0 10px;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#agent{display:none;font-size:10px;letter-spacing:.2em;padding:3px 11px;border-radius:999px;
  border:1px solid rgba(167,139,250,.4);background:rgba(167,139,250,.12);color:var(--violet)}

/* Outils */
.tools{gap:0}
.scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 14px 14px}
.act{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:11px;text-align:left;
  background:rgba(120,170,255,.06);border:1px solid var(--line);font-size:12.5px;transition:background .15s,border-color .15s,transform .1s}
.act:hover{background:rgba(34,211,238,.12);border-color:rgba(34,211,238,.4)}
.act:active{transform:scale(.97)}
.act .ic{font-size:16px;width:20px;text-align:center}
.act.busy{opacity:.55;pointer-events:none}
#widgets{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 12px}
.wg{flex:1 1 110px;padding:9px 12px;border-radius:11px;background:rgba(120,170,255,.05);border:1px solid var(--line)}
.wg small{display:block;font-size:9px;letter-spacing:.2em;color:var(--faint);text-transform:uppercase;margin-bottom:3px}
.wg b{font-size:19px;font-weight:600}
.wg em{display:block;font-style:normal;font-size:11px;color:var(--dim);margin-top:1px}
.bar{height:3px;background:var(--line);border-radius:2px;margin-top:6px}
.bar>div{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--cyan),var(--violet))}
#journal{flex:1;padding:0 14px 12px;display:flex;flex-direction:column;gap:3px;font-size:11.5px;min-height:70px}
.j{display:flex;gap:9px;color:var(--dim);line-height:1.4}
.j time{color:var(--faint);font-variant-numeric:tabular-nums;flex-shrink:0}
#cam{display:none;margin:0 14px 12px;border-radius:11px;overflow:hidden;border:1px solid var(--line);position:relative}
#cam.on{display:block}
#cam img{width:100%;display:block}
#cam span{position:absolute;top:7px;left:9px;font-size:9px;letter-spacing:.18em;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.6);color:var(--red)}

/* Barre de saisie */
.inputbar{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(14px)}
#inp{flex:1;background:transparent;border:0;color:var(--text);font:inherit;font-size:14px;padding:6px 8px;outline:none}
#inp::placeholder{color:var(--faint)}
.ibtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(120,170,255,.06);
  display:flex;align-items:center;justify-content:center;font-size:17px;transition:all .15s;flex-shrink:0}
.ibtn:hover{border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.12)}
.ibtn.active{background:rgba(52,211,153,.2);border-color:var(--green);box-shadow:0 0 16px rgba(52,211,153,.4)}
.ibtn.rec{background:rgba(248,113,113,.18);border-color:var(--red)}
.ibtn.send{background:var(--cyan);color:#04121a;border-color:var(--cyan);font-weight:700}
.ibtn.send:hover{filter:brightness(1.1)}
#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(10px);opacity:0;pointer-events:none;
  background:#10162c;border:1px solid var(--line);padding:9px 16px;border-radius:10px;font-size:12.5px;transition:all .25s;max-width:80vw}
#toast.show{opacity:1;transform:translateX(-50%)}

@media(max-width:980px){
  main{grid-template-columns:1fr;grid-auto-rows:minmax(260px,auto);overflow-y:auto}
  html,body{overflow:auto}.app{height:auto;min-height:100vh}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand"><b>NEXUS</b><span>Fik Conciergerie · Oran</span></div>
    <div class="chips">
      <div class="chip" id="c-local"><i></i>Local</div>
      <div class="chip" id="c-backend"><i></i>Dzaryx</div>
      <div class="chip" id="c-mic"><i></i>Micro</div>
      <div class="chip" id="c-cam"><i></i>Caméra</div>
      <div id="clock"></div>
    </div>
  </header>

  <main>
    <section class="card" aria-label="Conversation">
      <h2>Conversation</h2>
      <div id="chat"><div class="empty">Dis « Nexus » ou écris une commande.<br>Ex : « ouvre Chrome », « météo », « mets du Lacrim ».</div></div>
    </section>

    <section class="card stage" aria-label="Nexus">
      <div id="orbWrap"><canvas id="orb"></canvas></div>
      <div id="phase">En veille</div>
      <div id="agent"></div>
      <div id="sub">Nexus en attente</div>
    </section>

    <section class="card tools" aria-label="Outils">
      <h2>Actions rapides</h2>
      <div class="actions" id="actions"></div>
      <div id="widgets"></div>
      <div id="cam"><span>● LIVE</span><img id="camimg" alt="Caméra Nexus"></div>
      <h2>Journal</h2>
      <div id="journal" class="scroll"></div>
    </section>
  </main>

  <div class="inputbar">
    <button class="ibtn" id="btn-mic" title="Micro (Ctrl+M)" aria-label="Micro">🎤</button>
    <button class="ibtn" id="btn-cam" title="Caméra (Ctrl+K)" aria-label="Caméra">📷</button>
    <input id="inp" type="text" placeholder="Écris une commande à Nexus…" autocomplete="off" spellcheck="false" aria-label="Commande">
    <button class="ibtn send" id="btn-send" title="Envoyer (Entrée)" aria-label="Envoyer">➤</button>
  </div>
</div>
<div id="toast" role="status"></div>

<script>
'use strict';
const WS_URL = 'ws://localhost:7778';
const $ = id => document.getElementById(id);

const ACTIONS = [
  { ic:'🌐', label:'Chrome',        cmd:'ouvre chrome' },
  { ic:'💻', label:'VS Code',       cmd:'ouvre vs code' },
  { ic:'📸', label:'Capture écran', cmd:'screenshot' },
  { ic:'🖥️', label:'Analyse écran', cmd:'analyse écran' },
  { ic:'☀️', label:'Briefing',      cmd:'briefing du matin' },
  { ic:'⛅', label:'Météo Oran',    cmd:'météo' },
  { ic:'⏯️', label:'Pause musique', cmd:'pause' },
  { ic:'💾', label:'Disque',        widget:'disk' },
];

let ws = null, micOn = false, camOn = false, micOk = true;
let phase = 'idle', toastTimer = 0;
const PHASE_LABEL = { idle:'En veille', listening:"J'écoute", thinking:'Je réfléchis', speaking:'Je parle' };

/* ── Utilitaires ── */
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),3200); }
function chip(id,on){ $(id).className='chip '+(on===null?'':on?'on':'off'); }
function setSub(t){ $('sub').textContent=(t||'').slice(0,120); }
function setPhase(p){ phase=p; $('phase').textContent=PHASE_LABEL[p]; $('phase').style.color=`rgb(${PHASES[p].rgb.join(',')})`; }
function idlePhase(){ setPhase(micOn?'listening':'idle'); }

setInterval(()=>{ $('clock').textContent=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); },1000);

/* ── WebSocket ── */
function connect(){
  ws = new WebSocket(WS_URL);
  ws.onopen    = () => { chip('c-local',true); setSub('Nexus connecté'); };
  ws.onclose   = () => { chip('c-local',false); chip('c-backend',false); setTimeout(connect,2500); };
  ws.onerror   = () => chip('c-local',false);
  ws.onmessage = e => { try { handle(JSON.parse(e.data)); } catch(_){} };
}
function send(o){
  if(ws && ws.readyState===WebSocket.OPEN){ ws.send(JSON.stringify(o)); return true; }
  toast('Nexus local déconnecté — reconnexion…'); return false;
}

/* ── Messages du serveur ── */
function handle(d){
  switch(d.type){
    case 'status':
      if(d.backend!==undefined) chip('c-backend',!!d.backend);
      if(d.mic_available!==undefined){ micOk=!!d.mic_available; if(!micOk){ chip('c-mic',false); $('c-mic').title='PyAudio manquant : pip install pyaudio'; } else if(!micOn) chip('c-mic',null); }
      if(d.text){
        setSub(d.text);
        const m=d.text.match(/^AGENT\s+(\w+)/i);
        $('agent').style.display=m?'inline-block':'none'; if(m) $('agent').textContent='⬡ AGENT '+m[1].toUpperCase();
        if(/ACTIF|ÉCOUTE/i.test(d.text)) setPhase('listening'); else if(/VEILLE|ATTENTE/i.test(d.text)) idlePhase();
      }
      break;
    case 'thinking': if(d.active){ setPhase('thinking'); setSub('Je réfléchis…'); } else if(phase==='thinking') idlePhase(); break;
    case 'speak':    setPhase('speaking'); setSub(d.text||''); break;
    case 'waveform': if(d.active) setPhase('speaking'); else idlePhase(); break;
    case 'widget':   renderWidget(d.widget,d.data||{}); break;
    case 'journal':  if(d.history) renderJournal(d.history); break;
    case 'chat_history': renderChat(d.history||[]); break;
    case 'camera_frame':
      camOn=!!d.data; $('cam').classList.toggle('on',camOn); chip('c-cam',camOn?true:null); $('btn-cam').classList.toggle('rec',camOn);
      if(camOn) $('camimg').src='data:image/jpeg;base64,'+d.data; break;
  }
  document.querySelectorAll('.act.busy').forEach(b=>b.classList.remove('busy'));
}

/* ── Rendu : conversation / journal / widgets (textContent partout, jamais innerHTML sur du texte reçu) ── */
function renderChat(h){
  const box=$('chat'); box.textContent='';
  if(!h.length){ const e=document.createElement('div'); e.className='empty'; e.textContent='Dis « Nexus » ou écris une commande.'; box.appendChild(e); return; }
  h.forEach(m=>{ const d=document.createElement('div'); d.className='msg '+(m.role==='nexus'?'nexus':'user'); d.textContent=String(m.text||'').slice(0,800); box.appendChild(d); });
  box.scrollTop=box.scrollHeight;
}
function renderJournal(items){
  const box=$('journal'); box.textContent='';
  items.slice(-12).forEach(e=>{ const r=document.createElement('div'); r.className='j';
    const t=document.createElement('time'); t.textContent=e.ts; const s=document.createElement('span'); s.textContent=e.text;
    r.append(t,s); box.appendChild(r); });
  box.scrollTop=box.scrollHeight;
}
function renderWidget(type,data){
  const old=document.querySelector(`[data-wg="${type}"]`); if(old) old.remove();
  const w=document.createElement('div'); w.className='wg'; w.dataset.wg=type;
  const add=(title,val,sub,bar)=>{
    const s=document.createElement('small'); s.textContent=title; const b=document.createElement('b'); b.textContent=val; w.append(s,b);
    if(sub){ const e=document.createElement('em'); e.textContent=sub; w.appendChild(e); }
    if(bar!==undefined){ const o=document.createElement('div'); o.className='bar'; const i=document.createElement('div'); i.style.width=Math.min(100,bar)+'%'; o.appendChild(i); w.appendChild(o); }
  };
  if(type==='disk')          add('Disque C:',data.pct+'%',(data.free/1e9).toFixed(1)+' Go libres',data.pct);
  else if(type==='weather')  add('Météo Oran',data.temp+'°C',data.desc);
  else if(type==='bookings') add('Réservations',data.count,"actives aujourd'hui");
  else if(type==='railway')  add('Serveur',data.status==='ok'?'● En ligne':'✗ Hors ligne');
  else if(type==='music')    add('Musique',String(data.query||'').slice(0,28),data.platform==='youtube'?'YouTube':'Spotify');
  else if(type==='tiktok')   add('TikTok',String(data.result||'').slice(0,90));
  else if(type==='agent')    add('Agent',String(data.agent||''),String(data.result||'').slice(0,80));
  else return;
  $('widgets').appendChild(w);
}

/* ── Actions ── */
function sendCmd(text){
  text=text.trim(); if(!text) return;
  if(send({type:'message',text})){ setPhase('thinking'); setSub('Je m\'en occupe…'); }
}
$('inp').addEventListener('keydown',e=>{ if(e.key==='Enter'){ sendCmd($('inp').value); $('inp').value=''; } });
$('btn-send').addEventListener('click',()=>{ sendCmd($('inp').value); $('inp').value=''; $('inp').focus(); });

ACTIONS.forEach(a=>{
  const b=document.createElement('button'); b.className='act';
  const i=document.createElement('span'); i.className='ic'; i.textContent=a.ic; b.append(i,document.createTextNode(a.label));
  b.addEventListener('click',()=>{
    b.classList.add('busy'); setTimeout(()=>b.classList.remove('busy'),4000);
    if(a.widget) send({type:'widget_request',widget:a.widget}); else sendCmd(a.cmd);
  });
  $('actions').appendChild(b);
});

function toggleMic(){
  if(!micOk){ toast("Micro indisponible : PyAudio n'est pas installé sur ce PC."); return; }
  micOn=!micOn; $('btn-mic').classList.toggle('active',micOn); chip('c-mic',micOn?true:null);
  send({type:'mic_toggle',active:micOn}); idlePhase();
  toast(micOn?"Micro activé — parle, j'écoute":'Micro coupé');
}
function toggleCam(){ send({type:'camera_toggle'}); }
$('btn-mic').addEventListener('click',toggleMic);
$('btn-cam').addEventListener('click',toggleCam);
document.addEventListener('keydown',e=>{
  if(e.ctrlKey&&e.key==='m'){ e.preventDefault(); toggleMic(); }
  if(e.ctrlKey&&e.key==='k'){ e.preventDefault(); toggleCam(); }
  if(!e.ctrlKey&&!e.altKey&&!e.metaKey&&e.key.length===1&&document.activeElement.tagName!=='INPUT') $('inp').focus();
});

/* ── Orbe de particules (sphère de Fibonacci en Canvas 2D, code propre au projet) ── */
const PHASES={
  idle:     {radius:.70,spin:.15,jitter:.02,links:0,  rgb:[34,211,238]},
  listening:{radius:.62,spin:.30,jitter:.04,links:.35,rgb:[52,211,153]},
  thinking: {radius:.58,spin:.90,jitter:.03,links:.80,rgb:[167,139,250]},
  speaking: {radius:.74,spin:.45,jitter:.10,links:.50,rgb:[251,191,36]},
};
(function orb(){
  const cv=$('orb'), ctx=cv.getContext('2d'), COUNT=420, LINK=.22;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const g=Math.PI*(3-Math.sqrt(5));
  const base=Array.from({length:COUNT},(_,i)=>{const y=1-(i/(COUNT-1))*2,r=Math.sqrt(1-y*y),t=g*i;return{x:Math.cos(t)*r,y,z:Math.sin(t)*r,s:Math.random()*6.283};});
  const cur={radius:.7,spin:.15,jitter:.02,links:0,r:34,g:211,b:238,vol:0};
  let size=0,angle=0,last=performance.now();
  function fit(){ const w=$('orbWrap'), s=Math.max(160,Math.min(w.clientWidth,w.clientHeight,520)), dpr=Math.min(devicePixelRatio||1,2);
    size=s; cv.style.width=cv.style.height=s+'px'; cv.width=cv.height=s*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  new ResizeObserver(fit).observe($('orbWrap')); fit();
  function frame(now){
    const dt=Math.min((now-last)/1000,.05); last=now;
    const p=PHASES[phase], k=1-Math.exp(-dt*4);
    for(const key of ['radius','spin','jitter','links']) cur[key]+=(p[key]-cur[key])*k;
    cur.r+=(p.rgb[0]-cur.r)*k; cur.g+=(p.rgb[1]-cur.g)*k; cur.b+=(p.rgb[2]-cur.b)*k;
    const tv=phase==='speaking'?.45+.3*Math.sin(now/90)*Math.sin(now/230):0;
    cur.vol+=(tv-cur.vol)*(1-Math.exp(-dt*12));
    if(!reduce) angle+=cur.spin*dt;
    const t=now/1000, half=size/2, sc=half*(cur.radius+cur.vol*.12);
    const cA=Math.cos(angle), sA=Math.sin(angle), cT=Math.cos(.35), sT=Math.sin(.35);
    const pts=base.map(b=>{ const s=1+(reduce?0:Math.sin(t*3+b.s)*cur.jitter*(1+cur.vol*2));
      const x1=(b.x*cA-b.z*sA)*s, z1=(b.x*sA+b.z*cA)*s, y1=b.y*s; return{x:x1,y:y1*cT-z1*sT,z:y1*sT+z1*cT}; });
    ctx.clearRect(0,0,size,size);
    const rgb=`${cur.r|0},${cur.g|0},${cur.b|0}`;
    const gl=ctx.createRadialGradient(half,half,0,half,half,sc*1.1);
    gl.addColorStop(0,`rgba(${rgb},${.18+cur.vol*.25})`); gl.addColorStop(1,`rgba(${rgb},0)`);
    ctx.fillStyle=gl; ctx.fillRect(0,0,size,size);
    if(cur.links>.02){ ctx.lineWidth=.6; const f=pts.filter(q=>q.z>.1);
      for(let i=0;i<f.length;i+=2){ const a=f[i];
        for(let j=i+2;j<f.length;j+=3){ const c=f[j], dx=a.x-c.x, dy=a.y-c.y, dz=a.z-c.z, d2=dx*dx+dy*dy+dz*dz;
          if(d2<LINK*LINK){ ctx.strokeStyle=`rgba(${rgb},${(1-Math.sqrt(d2)/LINK)*cur.links*.35})`;
            ctx.beginPath(); ctx.moveTo(half+a.x*sc,half+a.y*sc); ctx.lineTo(half+c.x*sc,half+c.y*sc); ctx.stroke(); } } } }
    for(const q of pts){ const d=(q.z+1)/2; ctx.fillStyle=`rgba(${rgb},${.15+d*.85})`;
      ctx.beginPath(); ctx.arc(half+q.x*sc,half+q.y*sc,.5+d*1.4+cur.vol*d,0,6.283); ctx.fill(); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

setPhase('idle');
connect();
</script>
</body>
</html>
