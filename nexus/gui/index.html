<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS — Fik Conciergerie</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#03060f;--card:rgba(10,18,38,.72);--line:rgba(90,150,255,.16);--line2:rgba(90,150,255,.34);
  --text:#e8f0ff;--dim:#8ea3c8;--faint:#4f6288;
  --blue:#4aa3ff;--cyan:#38d8f5;--green:#34d399;--violet:#a78bfa;--red:#f87171;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(74,163,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(74,163,255,.045) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(ellipse 75% 70% at 50% 45%,#000 30%,transparent 100%);mask-image:radial-gradient(ellipse 75% 70% at 50% 45%,#000 30%,transparent 100%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 50% 45% at 50% 48%,rgba(30,100,220,.22),transparent 70%)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

.app{position:relative;z-index:1;height:100vh;display:grid;grid-template-columns:62px 1fr;grid-template-rows:auto auto 1fr auto;
  grid-template-areas:"rail head" "rail cards" "rail stage" "rail foot";gap:12px 16px;padding:14px 18px 14px 12px}

/* ── Rail d'actions ── */
.rail{grid-area:rail;display:flex;flex-direction:column;gap:8px;align-items:center;padding:8px 0;
  background:var(--card);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(14px);height:fit-content;align-self:center}
.rail .logo{width:34px;height:34px;border-radius:50%;margin-bottom:4px;
  background:radial-gradient(circle at 50% 50%,#fff 0 12%,var(--cyan) 20%,rgba(56,216,245,.18) 60%,transparent 72%);box-shadow:0 0 18px rgba(56,216,245,.6)}
.act{position:relative;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;
  transition:background .15s,transform .1s,box-shadow .15s}
.act:hover{background:rgba(74,163,255,.18);box-shadow:inset 0 0 0 1px var(--line2)}
.act:active{transform:scale(.92)}
.act.busy{opacity:.5;pointer-events:none}
.act::after{content:attr(data-label);position:absolute;left:52px;top:50%;transform:translateY(-50%) translateX(-4px);white-space:nowrap;
  background:#0b1430;border:1px solid var(--line2);border-radius:8px;padding:5px 10px;font-size:12px;opacity:0;pointer-events:none;transition:all .15s;z-index:5}
.act:hover::after,.act:focus-visible::after{opacity:1;transform:translateY(-50%)}

/* ── En-tête ── */
header{grid-area:head;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:baseline;gap:12px}
.brand b{font-size:18px;letter-spacing:.5em;font-weight:700;color:var(--cyan);text-shadow:0 0 14px rgba(56,216,245,.55)}
.brand span{font-size:11px;letter-spacing:.2em;color:var(--faint);text-transform:uppercase}
.right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:11px;letter-spacing:.08em;color:var(--dim)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.chip.on i{background:var(--green);box-shadow:0 0 8px var(--green)}
.chip.off i{background:var(--red);box-shadow:0 0 8px var(--red)}
button.chip:hover{border-color:var(--line2);color:var(--text)}
#dt{text-align:right;line-height:1.25;min-width:96px}
#dt b{display:block;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
#dt small{font-size:10.5px;color:var(--dim);letter-spacing:.06em;text-transform:capitalize}

/* ── Cartes ── */
.cards{grid-area:cards;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{display:flex;flex-direction:column;gap:2px;padding:11px 14px;text-align:left;border-radius:14px;
  background:var(--card);border:1px solid var(--line);backdrop-filter:blur(14px);transition:border-color .15s,transform .1s;position:relative}
.card:hover{border-color:var(--line2)}
.card:active{transform:scale(.98)}
.card .ic{font-size:14px;opacity:.9;margin-bottom:2px}
.card b{font-size:24px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.card small{font-size:11px;color:var(--dim);letter-spacing:.04em}
.card .chev{position:absolute;right:12px;bottom:10px;color:var(--faint);font-size:13px}
.card .bar{height:3px;background:var(--line);border-radius:2px;margin-top:5px}
.card .bar>div{height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:width .6s}
.card.ok b{color:var(--green)}.card.ko b{color:var(--red)}

/* ── Scène HUD ── */
.stage{grid-area:stage;position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
#hud{display:block}
.caption{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);text-align:center;max-width:min(560px,70%);pointer-events:none}
#phase{font-size:12px;letter-spacing:.38em;text-transform:uppercase;color:var(--cyan);text-shadow:0 0 12px currentColor;transition:color .4s}
#sub{font-size:12.5px;color:var(--dim);margin-top:4px;min-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#agent{display:none;margin-top:5px;font-size:10px;letter-spacing:.2em;padding:3px 11px;border-radius:999px;border:1px solid rgba(167,139,250,.4);background:rgba(167,139,250,.12);color:var(--violet)}
#feed{position:absolute;left:0;bottom:0;width:min(340px,32%);display:flex;flex-direction:column;gap:7px;max-height:62%;overflow-y:auto;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.msg{padding:8px 12px;border-radius:12px;font-size:12.5px;line-height:1.45;word-break:break-word;backdrop-filter:blur(12px);
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;animation:in .3s ease}
.msg.nexus{background:rgba(56,216,245,.09);border:1px solid rgba(56,216,245,.22);align-self:flex-start}
.msg.user{background:rgba(167,139,250,.13);border:1px solid rgba(167,139,250,.28);align-self:flex-end}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#cam{display:none;position:absolute;right:0;top:0;width:min(300px,28%);border-radius:12px;overflow:hidden;border:1px solid var(--line2)}
#cam.on{display:block}#cam img{width:100%;display:block}
#cam span{position:absolute;top:7px;left:9px;font-size:9px;letter-spacing:.18em;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.6);color:var(--red)}

/* ── Panneaux ── */
#panel{position:absolute;inset:0 0 62px 0;display:none;flex-direction:column;border-radius:18px;background:rgba(6,12,30,.9);border:1px solid var(--line2);
  backdrop-filter:blur(18px);box-shadow:0 20px 70px rgba(0,0,0,.55),0 0 40px rgba(74,163,255,.12);overflow:hidden;z-index:4}
#panel.on{display:flex;animation:pin .35s cubic-bezier(.2,.8,.2,1)}
@keyframes pin{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
#ptabs{display:flex;gap:6px;flex-wrap:wrap}
.ptab{padding:6px 13px;border-radius:999px;font-size:12.5px;color:var(--dim);border:1px solid var(--line);background:rgba(74,163,255,.05)}
.ptab.on{color:var(--text);border-color:var(--cyan);background:rgba(56,216,245,.14)}
.x{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);font-size:14px;color:var(--dim)}
.x:hover{color:var(--text);border-color:var(--line2)}
.pb{flex:1;overflow:auto;padding:16px 18px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.pbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.pbtn{padding:9px 16px;border-radius:11px;font-size:13px;border:1px solid var(--line2);background:rgba(74,163,255,.1);transition:all .15s}
.pbtn:hover{background:rgba(74,163,255,.22)}
.pbtn.go{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#031018;border:0;font-weight:600}
.pbtn:disabled{opacity:.5;pointer-events:none}
.pnote{display:inline-flex;gap:8px;align-items:center;padding:6px 12px;border-radius:999px;font-size:11.5px;color:var(--dim);border:1px solid var(--line);margin-bottom:12px}
.pnote.warn{color:#fbbf24;border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08)}
.pempty{color:var(--dim);padding:30px 8px;text-align:center}
/* agenda */
.agenda{display:grid;grid-template-columns:minmax(250px,320px) 1fr;gap:18px;height:100%;min-height:0}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:600;text-transform:capitalize}
.cal-h button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);color:var(--dim)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:10px;color:var(--faint);text-align:center;padding-bottom:3px;text-transform:uppercase}
.cal .d{aspect-ratio:1;border-radius:9px;border:1px solid transparent;background:rgba(74,163,255,.05);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--dim)}
.cal .d.has{color:var(--text);border-color:var(--line)}
.cal .d.today{border-color:var(--cyan);color:var(--cyan)}
.cal .d.sel{background:rgba(56,216,245,.2);border-color:var(--cyan)}
.cal .d.off{visibility:hidden}
.dots{display:flex;gap:2px;height:5px}.dots i{width:5px;height:5px;border-radius:50%}
.blist{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0;padding-right:4px}
.brow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 13px;border-radius:12px;background:rgba(74,163,255,.06);border:1px solid var(--line)}
.brow b{font-weight:600}.brow small{color:var(--dim);font-size:12px}
.chipst{padding:2px 9px;border-radius:999px;font-size:10.5px;letter-spacing:.06em;border:1px solid currentColor;align-self:start;justify-self:end}
/* documents / chart / facture */
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.doc{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(74,163,255,.05)}
.doc img{width:100%;max-height:340px;object-fit:contain;background:#000;display:block;cursor:zoom-in}
.doc img.big{position:fixed;inset:4vh 4vw;width:92vw;height:92vh;max-height:none;z-index:20;cursor:zoom-out;border:1px solid var(--line2);border-radius:14px}
.doc div{padding:10px 13px;font-size:12.5px;color:var(--dim)}.doc b{color:var(--text);display:block;font-size:13.5px}
.frame{width:100%;height:100%;min-height:340px;border:0;border-radius:12px;background:#fff}
.pimg{max-width:100%;max-height:100%;display:block;margin:0 auto;border-radius:12px}
.rowl{display:flex;justify-content:space-between;gap:12px;padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:rgba(74,163,255,.06);margin-bottom:8px;font-size:13px}
.rowl a{color:var(--cyan);text-decoration:none;word-break:break-all}.rowl a:hover{text-decoration:underline}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.stat{padding:13px 15px;border-radius:12px;border:1px solid var(--line);background:rgba(74,163,255,.06)}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.stat small{color:var(--dim);font-size:11.5px}
@media(max-width:900px){.agenda{grid-template-columns:1fr}}

/* ── Saisie ── */
footer{grid-area:foot;display:flex;gap:10px;align-items:center;padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(14px)}
#inp{flex:1;background:transparent;border:0;color:var(--text);font:inherit;font-size:14px;padding:6px 8px;outline:none}
#inp::placeholder{color:var(--faint)}
.ibtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(74,163,255,.07);display:flex;align-items:center;justify-content:center;font-size:17px;transition:all .15s;flex-shrink:0}
.ibtn:hover{border-color:var(--line2);background:rgba(74,163,255,.17)}
.ibtn.active{background:rgba(52,211,153,.2);border-color:var(--green);box-shadow:0 0 16px rgba(52,211,153,.4)}
.ibtn.rec{background:rgba(248,113,113,.18);border-color:var(--red)}
.ibtn.send{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#031018;border:0;font-weight:700}
.ibtn.send:hover{filter:brightness(1.12)}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(10px);opacity:0;pointer-events:none;z-index:9;
  background:#0b1430;border:1px solid var(--line2);padding:9px 16px;border-radius:10px;font-size:12.5px;transition:all .25s;max-width:80vw}
#toast.show{opacity:1;transform:translateX(-50%)}

@media(max-width:900px){
  .app{grid-template-columns:1fr;grid-template-areas:"head" "cards" "stage" "foot" "rail";grid-template-rows:auto auto minmax(380px,1fr) auto auto}
  .rail{flex-direction:row;flex-wrap:wrap;justify-content:center;height:auto;padding:8px}
  .cards{grid-template-columns:repeat(2,1fr)}
  #feed{position:static;width:100%;max-height:none}
  html,body{overflow:auto}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">

  <nav class="rail" id="rail" aria-label="Actions rapides"><div class="logo" aria-hidden="true"></div></nav>

  <header>
    <div class="brand"><b>NEXUS</b><span>Fik Conciergerie · Oran</span></div>
    <div class="right">
      <div class="chip" id="c-local"><i></i>Local</div>
      <div class="chip" id="c-backend"><i></i>Dzaryx</div>
      <div class="chip" id="c-mic"><i></i>Micro</div>
      <div class="chip" id="c-cam"><i></i>Caméra</div>
      <button class="chip" id="btn-fs" title="Plein écran (F11)" aria-label="Plein écran">⛶</button>
      <div id="dt"><b id="clock">--:--:--</b><small id="date"></small></div>
    </div>
  </header>

  <section class="cards" aria-label="Indicateurs">
    <button class="card" data-w="bookings"><span class="ic">📅</span><b id="v-bookings">—</b><small>Réservations actives</small><span class="chev">›</span></button>
    <button class="card" data-w="weather"><span class="ic">⛅</span><b id="v-weather">—</b><small id="s-weather">Météo Oran</small><span class="chev">›</span></button>
    <button class="card" data-w="disk"><span class="ic">💾</span><b id="v-disk">—</b><small id="s-disk">Disque C:</small><div class="bar"><div id="b-disk"></div></div></button>
    <button class="card" data-w="railway" id="card-railway"><span class="ic">🛰️</span><b id="v-railway">—</b><small>Serveur Dzaryx</small><span class="chev">›</span></button>
  </section>

  <section class="stage" id="stage" aria-label="Nexus">
    <canvas id="hud" role="img" aria-label="Nexus"></canvas>
    <div id="feed" aria-live="polite"></div>
    <div id="panel" role="region" aria-label="Panneau"><div class="ph"><div id="ptabs"></div><button class="x" id="pclose" aria-label="Fermer le panneau" title="Fermer (Échap)">✕</button></div><div class="pb" id="pbody"></div></div>
    <div id="cam"><span>● LIVE</span><img id="camimg" alt="Caméra Nexus"></div>
    <div class="caption">
      <div id="phase">En veille</div>
      <div id="agent"></div>
      <div id="sub">Nexus en attente</div>
    </div>
  </section>

  <footer>
    <button class="ibtn" id="btn-mic" title="Micro (Ctrl+M)" aria-label="Micro">🎤</button>
    <button class="ibtn" id="btn-cam" title="Caméra (Ctrl+K)" aria-label="Caméra">📷</button>
    <input id="inp" type="text" placeholder="Parle à Nexus ou écris une commande…" autocomplete="off" spellcheck="false" aria-label="Commande">
    <button class="ibtn send" id="btn-send" title="Envoyer (Entrée)" aria-label="Envoyer">➤</button>
  </footer>
</div>
<div id="toast" role="status"></div>

<script>
'use strict';
const WS_URL = 'ws://localhost:7778';
const $ = id => document.getElementById(id);

const ACTIONS = [
  { ic:'🌐', label:'Ouvrir Chrome',  cmd:'ouvre chrome' },
  { ic:'💻', label:'Ouvrir VS Code', cmd:'ouvre vs code' },
  { ic:'📸', label:'Capture d\'écran', cmd:'screenshot' },
  { ic:'🖥️', label:'Analyser l\'écran', cmd:'analyse écran' },
  { ic:'☀️', label:'Briefing du jour', cmd:'briefing du matin' },
  { ic:'⏯️', label:'Pause musique',  cmd:'pause' },
];

let ws = null, micOn = false, camOn = false, micOk = true;
let phase = 'idle', toastTimer = 0;
const PHASE_LABEL = { idle:'En veille', listening:"J'écoute", thinking:'Je réfléchis', speaking:'Je parle' };

/* ── Utilitaires ── */
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),3200); }
function chip(id,on){ $(id).className='chip '+(on===null?'':on?'on':'off'); }
function setSub(t){ $('sub').textContent=(t||'').slice(0,140); }
function setPhase(p){ phase=p; $('phase').textContent=PHASE_LABEL[p]; $('phase').style.color=`rgb(${PHASES[p].rgb.join(',')})`; }
function idlePhase(){ setPhase(micOn?'listening':'idle'); }
function tick(){ const d=new Date(); $('clock').textContent=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  $('date').textContent=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}); }
setInterval(tick,1000); tick();

/* ── WebSocket ── */
function connect(){
  ws = new WebSocket(WS_URL);
  ws.onopen = () => { chip('c-local',true); setSub('Nexus connecté'); ['disk','weather','bookings','railway'].forEach(w=>send({type:'widget_request',widget:w})); };
  ws.onclose = () => { chip('c-local',false); chip('c-backend',false); setTimeout(connect,2500); };
  ws.onerror = () => chip('c-local',false);
  ws.onmessage = e => { try { handle(JSON.parse(e.data)); } catch(_){} };
}
function send(o){
  if(ws && ws.readyState===WebSocket.OPEN){ ws.send(JSON.stringify(o)); return true; }
  toast('Nexus local déconnecté — reconnexion…'); return false;
}

/* ── Messages du serveur ── */
function handle(d){
  switch(d.type){
    case 'status':
      if(d.backend!==undefined) chip('c-backend',!!d.backend);
      if(d.mic_available!==undefined){ micOk=!!d.mic_available; if(!micOk){ chip('c-mic',false); $('c-mic').title='PyAudio manquant : pip install pyaudio'; } else if(!micOn) chip('c-mic',null); }
      if(d.text){
        setSub(d.text);
        const m=d.text.match(/^AGENT\s+(\w+)/i);
        $('agent').style.display=m?'inline-block':'none'; if(m) $('agent').textContent='⬡ AGENT '+m[1].toUpperCase();
        if(/ACTIF|ÉCOUTE/i.test(d.text)) setPhase('listening'); else if(/VEILLE|ATTENTE/i.test(d.text)) idlePhase();
      }
      break;
    case 'thinking': if(d.active){ setPhase('thinking'); setSub('Je réfléchis…'); } else if(phase==='thinking') idlePhase(); break;
    case 'speak':    setPhase('speaking'); setSub(d.text||''); break;
    case 'waveform': if(d.active) setPhase('speaking'); else idlePhase(); break;
    case 'widget':   renderWidget(d.widget,d.data||{}); break;
    case 'chat_history': renderChat(d.history||[]); break;
    case 'panel':    showPanel(d); break;
    case 'camera_frame':
      camOn=!!d.data; $('cam').classList.toggle('on',camOn); chip('c-cam',camOn?true:null); $('btn-cam').classList.toggle('rec',camOn);
      if(camOn) $('camimg').src='data:image/jpeg;base64,'+d.data; break;
  }
  document.querySelectorAll('.act.busy').forEach(b=>b.classList.remove('busy'));
}

/* ── Rendu (textContent uniquement pour tout texte reçu) ── */
function renderChat(h){
  const box=$('feed'); box.textContent='';
  h.slice(-4).forEach(m=>{ const d=document.createElement('div'); d.className='msg '+(m.role==='nexus'?'nexus':'user'); d.textContent=String(m.text||'').slice(0,400); box.appendChild(d); });
  box.scrollTop=box.scrollHeight;
}
function renderWidget(type,data){
  const set=(id,t)=>{ $(id).textContent=t; };
  if(type==='disk'){ set('v-disk',data.pct+'%'); set('s-disk','Disque C: · '+(data.free/1e9).toFixed(1)+' Go libres'); $('b-disk').style.width=Math.min(100,data.pct)+'%'; }
  else if(type==='weather'){ set('v-weather',data.temp+'°C'); set('s-weather','Oran'+(data.desc?' · '+data.desc:'')); }
  else if(type==='bookings'){ set('v-bookings',data.count); }
  else if(type==='railway'){ const ok=data.status==='ok'; set('v-railway',ok?'En ligne':'Hors ligne'); $('card-railway').className='card '+(ok?'ok':'ko'); }
}

/* ── Actions ── */
function sendCmd(text){
  text=text.trim(); if(!text) return;
  if(send({type:'message',text})){ setPhase('thinking'); setSub("Je m'en occupe…"); }
}
$('inp').addEventListener('keydown',e=>{ if(e.key==='Enter'){ sendCmd($('inp').value); $('inp').value=''; } });
$('btn-send').addEventListener('click',()=>{ sendCmd($('inp').value); $('inp').value=''; $('inp').focus(); });

ACTIONS.forEach(a=>{
  const b=document.createElement('button'); b.className='act'; b.textContent=a.ic; b.dataset.label=a.label; b.setAttribute('aria-label',a.label);
  b.addEventListener('click',()=>{ b.classList.add('busy'); setTimeout(()=>b.classList.remove('busy'),4000); sendCmd(a.cmd); });
  $('rail').appendChild(b);
});
document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>send({type:'widget_request',widget:c.dataset.w})));

function toggleMic(){
  if(!micOk){ toast("Micro indisponible : PyAudio n'est pas installé sur ce PC."); return; }
  micOn=!micOn; $('btn-mic').classList.toggle('active',micOn); chip('c-mic',micOn?true:null);
  send({type:'mic_toggle',active:micOn}); idlePhase();
  toast(micOn?"Micro activé — parle, j'écoute":'Micro coupé');
}
function toggleCam(){ send({type:'camera_toggle'}); }
$('btn-mic').addEventListener('click',toggleMic);
$('btn-cam').addEventListener('click',toggleCam);
$('btn-fs').addEventListener('click',()=>{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>toast('Plein écran : utilise F11')); });
document.addEventListener('keydown',e=>{
  if(e.ctrlKey&&e.key==='m'){ e.preventDefault(); toggleMic(); }
  if(e.ctrlKey&&e.key==='k'){ e.preventDefault(); toggleCam(); }
  if(!e.ctrlKey&&!e.altKey&&!e.metaKey&&e.key.length===1&&document.activeElement.tagName!=='INPUT') $('inp').focus();
});

/* ══════════ Panneaux (agenda, documents, facture, liens, graphique, dossier, ménage) ══════════
   Tout texte venu du serveur passe par textContent ; les URLs sont filtrées (https ou /files/ seulement). */
const panels = []; let panelIdx = -1;
const safeUrl = u => (typeof u === 'string' && /^(https:\/\/|\/files\/)/.test(u)) ? u : '';
function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined) e.textContent=text; return e; }
function btn(label, cls, fn){ const b=el('button','pbtn'+(cls?' '+cls:''),label); b.addEventListener('click',()=>fn(b)); return b; }
function act(o){ send(Object.assign({type:'panel_action'},o)); }
const fmtD = s => s ? s.slice(8,10)+'/'+s.slice(5,7) : '';
const money = n => (n==null||n==='') ? '—' : Number(n).toLocaleString('fr-FR')+' €';
const ST = { CONFIRMED:['Confirmée','#34d399'], ACTIVE:['En cours','#38d8f5'], PENDING:['En attente','#fbbf24'], COMPLETED:['Terminée','#8ea3c8'], CANCELLED:['Annulée','#f87171'] };

function showPanel(d){
  panels.push(d); if(panels.length>6) panels.shift(); panelIdx=panels.length-1; drawPanel();
}
function closePanel(){ panels.length=0; panelIdx=-1; $('panel').classList.remove('on'); }
function drawPanel(){
  const p=panels[panelIdx]; if(!p){ closePanel(); return; }
  $('panel').classList.add('on');
  const tabs=$('ptabs'); tabs.textContent='';
  panels.forEach((q,i)=>{ const t=el('button','ptab'+(i===panelIdx?' on':''),q.title); t.addEventListener('click',()=>{ panelIdx=i; drawPanel(); }); tabs.appendChild(t); });
  const body=$('pbody'); body.textContent='';
  const R={bookings:rBookings,document:rDocument,invoice:rInvoice,links:rLinks,chart:rChart,folder:rFolder,cleanup:rCleanup}[p.kind];
  if(R) R(body,p.data||{}); else body.appendChild(el('div','pempty','Panneau inconnu.'));
}
$('pclose').addEventListener('click',closePanel);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ const big=document.querySelector('.doc img.big'); if(big) big.classList.remove('big'); else closePanel(); } });

function rBookings(body,d){
  const items=d.items||[]; const [ty,tm]=String(d.today||'').split('-').map(Number);
  let y=ty||new Date().getFullYear(), m=tm||new Date().getMonth()+1, sel=null;
  if(!items.length){ body.appendChild(el('div','pempty','Aucune réservation trouvée.')); return; }
  const wrap=el('div','agenda'), left=el('div'), right=el('div','blist');
  const head=el('div','cal-h'), prev=el('button','',"‹"), next=el('button','',"›"), title=el('span');
  head.append(prev,title,next); const cal=el('div','cal'); left.append(head,cal);
  const pad=n=>String(n).padStart(2,'0');
  const overl=day=>items.filter(b=>b.start_date&&b.end_date&&b.start_date<=day&&day<=b.end_date&&b.status!=='CANCELLED');
  function drawList(){
    right.textContent='';
    const list=sel? overl(sel) : items.slice(0,40);
    right.appendChild(el('div','pnote',sel? 'Le '+fmtD(sel)+'/'+sel.slice(0,4)+' · '+list.length+' réservation(s) — clique à nouveau pour tout voir' : items.length+' réservations · les plus récentes en premier'));
    if(!list.length) right.appendChild(el('div','pempty','Rien ce jour-là.'));
    list.forEach(b=>{ const [lab,col]=ST[b.status]||[b.status||'—','#8ea3c8']; const row=el('div','brow');
      row.appendChild(el('b','',b.client_name||'Client')); const chip=el('span','chipst',lab); chip.style.color=col; row.appendChild(chip);
      row.appendChild(el('small','',(b.car||'Véhicule')+' · '+fmtD(b.start_date)+' → '+fmtD(b.end_date)));
      row.appendChild(el('small','',money(b.paid_amount)+' / '+money(b.final_price))); right.appendChild(row); });
  }
  function drawCal(){
    cal.textContent=''; title.textContent=new Date(y,m-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
    ['L','M','M','J','V','S','D'].forEach(w=>cal.appendChild(el('div','dow',w)));
    const first=(new Date(y,m-1,1).getDay()+6)%7, days=new Date(y,m,0).getDate();
    for(let i=0;i<first;i++) cal.appendChild(el('div','d off'));
    for(let n=1;n<=days;n++){
      const day=y+'-'+pad(m)+'-'+pad(n), bs=overl(day);
      const c=el('button','d'+(bs.length?' has':'')+(day===d.today?' today':'')+(day===sel?' sel':''),String(n));
      if(bs.length){ const dots=el('span','dots'); bs.slice(0,3).forEach(b=>{ const i=el('i'); i.style.background=(ST[b.status]||[0,'#8ea3c8'])[1]; dots.appendChild(i); }); c.appendChild(dots); }
      c.addEventListener('click',()=>{ sel=(sel===day)?null:day; drawCal(); drawList(); }); cal.appendChild(c);
    }
  }
  prev.addEventListener('click',()=>{ m--; if(m<1){m=12;y--;} drawCal(); });
  next.addEventListener('click',()=>{ m++; if(m>12){m=1;y++;} drawCal(); });
  drawCal(); drawList(); wrap.append(left,right); body.appendChild(wrap);
}
function rDocument(body,d){
  const docs=d.docs||[];
  if(!docs.length){ body.appendChild(el('div','pempty','Aucun document trouvé pour « '+(d.who||'')+' ».')); return; }
  body.appendChild(el('div','pnote warn','🔒 Document sensible — cette consultation est enregistrée dans le journal d\'accès.'));
  const grid=el('div','docs');
  docs.forEach(x=>{ const card=el('div','doc'), u=safeUrl(x.url);
    if(u && !/\.pdf(\?|$)/i.test(u)){ const im=el('img'); im.alt=(x.type||'document')+' de '+(x.client_name||''); im.src=u; im.addEventListener('click',()=>im.classList.toggle('big')); card.appendChild(im); }
    const info=el('div'); const label={passport:'Passeport',license:'Permis',contract:'Contrat',other:'Autre'}[x.type]||'Document';
    info.appendChild(el('b','',label+' — '+(x.client_name||''))); info.appendChild(document.createTextNode((x.created_at||'').slice(0,10)+(x.notes?' · '+x.notes:'')));
    if(u && /\.pdf(\?|$)/i.test(u)){ const a=el('a','pbtn','Ouvrir le PDF'); a.href=u; a.target='_blank'; a.rel='noopener noreferrer'; info.appendChild(el('br')); info.appendChild(a); }
    card.appendChild(info); grid.appendChild(card); });
  body.appendChild(grid);
}
function rInvoice(body,d){
  body.style.display='flex'; body.style.flexDirection='column';
  const f=el('iframe','frame'); f.title='Facture'; f.src=safeUrl(d.src); body.appendChild(f);
  const row=el('div','pbtns');
  row.append(btn('Ouvrir le PDF','go',()=>act({action:'open_path',path:d.path})),
             btn('Envoyer le lien sur Telegram','',b=>{ act({action:'send_telegram',text:'Facture '+(d.client||'')+' : '+d.url}); b.textContent='Envoyé ✓'; b.disabled=true; }));
  const info=el('div','pnote','Enregistrée : '+d.path); info.style.margin='14px 0 0'; row.appendChild(info); body.appendChild(row);
}
function rLinks(body,d){
  body.appendChild(el('div','pnote','✓ Envoyés sur ton Telegram'));
  (d.items||[]).forEach(i=>{ const r=el('div','rowl'); r.appendChild(el('span','',i.label)); const u=safeUrl(i.url);
    if(u){ const a=el('a','',i.url); a.href=u; a.target='_blank'; a.rel='noopener noreferrer'; r.appendChild(a); } body.appendChild(r); });
}
function rChart(body,d){
  const im=el('img','pimg'); im.alt='Graphique des réservations par mois'; im.src=safeUrl(d.src); body.appendChild(im);
  const row=el('div','pbtns'); row.append(btn('Ouvrir le dossier','go',()=>act({action:'open_path',path:d.folder})),btn('Ouvrir le graphique','',()=>act({action:'open_path',path:d.path})));
  const n=el('div','pnote','Enregistré : '+d.path); n.style.margin='14px 0 0'; row.appendChild(n); body.appendChild(row);
}
function rFolder(body,d){
  body.appendChild(el('div','pnote','📁 '+d.path));
  (d.files||[]).forEach(f=>{ const r=el('div','rowl'); r.appendChild(el('span','',f.name)); r.appendChild(el('span','',f.info||'')); body.appendChild(r); });
  body.appendChild(el('div','pbtns')).appendChild(btn('Ouvrir le dossier','go',()=>act({action:'open_path',path:d.path})));
}
function rCleanup(body,d){
  const s=el('div','stats');
  [[(d.temp_mb||0)+' Mo','Fichiers temporaires libérables'],[(d.pct??'—')+' %','Disque C: utilisé'],[(d.free_gb??'—')+' Go','Espace libre']].forEach(([v,l])=>{ const c=el('div','stat'); c.append(el('b','',v),el('small','',l)); s.appendChild(c); });
  body.appendChild(s);
  if(d.done) body.appendChild(el('div','pnote','✓ '+d.done));
  if((d.big||[]).length){ body.appendChild(el('div','pnote warn','Gros fichiers dans Téléchargements — à vérifier toi-même, je n\'y touche pas')); d.big.forEach(f=>{ const r=el('div','rowl'); r.appendChild(el('span','',f.name)); r.appendChild(el('span','',f.mb+' Mo · '+f.age+' j')); body.appendChild(r); }); }
  if(!d.done) body.appendChild(el('div','pbtns')).appendChild(btn(d.temp_mb>0?'Nettoyer les fichiers temporaires ('+d.temp_mb+' Mo)':'Rien à nettoyer','go',b=>{ act({action:'cleanup_confirm'}); b.disabled=true; b.textContent='Nettoyage en cours…'; })).disabled=!(d.temp_mb>0);
  body.appendChild(el('div','pnote','Seuls les fichiers temporaires de plus de 2 jours sont supprimés.'));
}

/* ══════════ HUD animé (Canvas 2D, dessiné de zéro) ══════════
   anneaux à graduations en contre-rotation, arcs balayeurs, globe en fil de fer, orbite elliptique, étincelles.
   La phase (veille / écoute / réflexion / parole) règle vitesse, intensité et teinte. */
const PHASES={
  idle:     {spin:1.0,glow:.55,rgb:[74,163,255]},
  listening:{spin:1.6,glow:.80,rgb:[56,216,245]},
  thinking: {spin:4.2,glow:.95,rgb:[167,139,250]},
  speaking: {spin:2.2,glow:1.0,rgb:[96,190,255]},
};
(function hud(){
  const cv=$('hud'), ctx=cv.getContext('2d'), stage=$('stage'), TAU=Math.PI*2;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let S=0, last=performance.now();
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const arcsOf=(n,min,max)=>{ const out=[]; let a=rnd(0,TAU); for(let i=0;i<n;i++){ const len=rnd(min,max); out.push([a,len]); a+=len+rnd(.25,.9); } return out; };
  const ringArcs=[arcsOf(7,.35,.8), arcsOf(4,.5,1.1), arcsOf(3,.9,1.6)];
  const g=Math.PI*(3-Math.sqrt(5)), GN=240;
  const globe=Array.from({length:GN},(_,i)=>{ const y=1-(i/(GN-1))*2, r=Math.sqrt(1-y*y), t=g*i; return{x:Math.cos(t)*r,y,z:Math.sin(t)*r}; });
  const sparks=Array.from({length:34},()=>({r:rnd(.18,.97),a:rnd(0,TAU),v:rnd(-.25,.25),p:rnd(0,TAU),s:rnd(.6,1.7)}));
  const cur={spin:1,glow:.55,r:74,g:163,b:255,vol:0};
  const ang={outer:0,mid:0,inner:0,sweep:0,globe:0,orbit:0};

  function fit(){ const dpr=Math.min(devicePixelRatio||1,2);
    S=Math.max(260,Math.min(stage.clientWidth,stage.clientHeight-64,820));
    cv.style.width=cv.style.height=S+'px'; cv.width=cv.height=Math.round(S*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); }
  new ResizeObserver(fit).observe(stage); fit();

  function frame(now){
    requestAnimationFrame(frame);
    if(document.hidden) { last=now; return; }
    const dt=Math.min((now-last)/1000,.05); last=now;
    const p=PHASES[phase], k=1-Math.exp(-dt*3);
    cur.spin+=(p.spin-cur.spin)*k; cur.glow+=(p.glow-cur.glow)*k;
    cur.r+=(p.rgb[0]-cur.r)*k; cur.g+=(p.rgb[1]-cur.g)*k; cur.b+=(p.rgb[2]-cur.b)*k;
    const tv = phase==='speaking' ? .5+.35*Math.sin(now/85)*Math.sin(now/210+1) : phase==='listening' ? .18+.12*Math.sin(now/260) : 0;
    cur.vol+=(tv-cur.vol)*(1-Math.exp(-dt*10));
    if(!reduce){ const s=cur.spin*dt;
      ang.outer+=.05*s; ang.mid-=.11*s; ang.inner+=.2*s; ang.sweep+=.7*s; ang.globe+=.16*s; ang.orbit+=.55*s; }

    const c=S/2, R=c*.97, rgb=`${cur.r|0},${cur.g|0},${cur.b|0}`, col=a=>`rgba(${rgb},${a})`;
    const t=now/1000, br=.85+.15*Math.sin(t*1.6);   // respiration
    ctx.clearRect(0,0,S,S);
    ctx.lineCap='round';

    // halo de fond
    let gr=ctx.createRadialGradient(c,c,0,c,c,R*.95);
    gr.addColorStop(0,col(.34*cur.glow*br+cur.vol*.25)); gr.addColorStop(.45,col(.10*cur.glow)); gr.addColorStop(1,col(0));
    ctx.fillStyle=gr; ctx.fillRect(0,0,S,S);

    const ticks=(r,n,every,lS,lL,w,rot,a)=>{ ctx.lineWidth=w; ctx.strokeStyle=col(a); ctx.beginPath();
      for(let i=0;i<n;i++){ const an=rot+i/n*TAU, L=(i%every===0)?lL:lS, cs=Math.cos(an), sn=Math.sin(an);
        ctx.moveTo(c+cs*(r-L)*R, c+sn*(r-L)*R); ctx.lineTo(c+cs*r*R, c+sn*r*R); } ctx.stroke(); };
    const circle=(r,w,a,dash)=>{ ctx.lineWidth=w; ctx.strokeStyle=col(a); ctx.setLineDash(dash||[]); ctx.beginPath(); ctx.arc(c,c,r*R,0,TAU); ctx.stroke(); ctx.setLineDash([]); };
    const arcs=(list,r,w,a,rot)=>{ ctx.lineWidth=w; ctx.strokeStyle=col(a); list.forEach(([s,l])=>{ ctx.beginPath(); ctx.arc(c,c,r*R,rot+s,rot+s+l); ctx.stroke(); }); };

    // anneau extérieur à graduations
    ticks(.985,144,6,.016,.042,1.2,ang.outer,.75*cur.glow+.2);
    circle(.93,1,.30);
    // arcs segmentés
    arcs(ringArcs[0],.88,3.2,.55*cur.glow+.15,ang.mid);
    circle(.82,1,.22,[2,7]);
    // graduations fines, sens inverse
    ticks(.78,96,4,.010,.026,1,-ang.mid*1.4,.5*cur.glow+.15);
    // arcs balayeurs lumineux
    ctx.globalCompositeOperation='lighter';
    arcs(ringArcs[1],.70,2.4,.8*cur.glow,ang.inner);
    arcs(ringArcs[2],.66,5,.22*cur.glow,-ang.sweep*.6);
    ctx.globalCompositeOperation='source-over';
    circle(.62,1,.28);
    // arc de balayage type radar
    ctx.lineWidth=2; ctx.strokeStyle=col(.9*cur.glow); ctx.beginPath(); ctx.arc(c,c,.74*R,ang.sweep,ang.sweep+.5); ctx.stroke();

    // globe en fil de fer + points
    const GR=R*(.50+cur.vol*.05), cA=Math.cos(ang.globe), sA=Math.sin(ang.globe), tilt=.32, cT=Math.cos(tilt), sT=Math.sin(tilt);
    gr=ctx.createRadialGradient(c,c,0,c,c,GR*1.5);
    gr.addColorStop(0,`rgba(255,255,255,${.5*cur.glow})`); gr.addColorStop(.18,col(.55*cur.glow+cur.vol*.3)); gr.addColorStop(.6,col(.12*cur.glow)); gr.addColorStop(1,col(0));
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(c,c,GR*1.5,0,TAU); ctx.fill();
    ctx.lineWidth=.7; ctx.strokeStyle=col(.18*cur.glow+.06);
    for(let la=-3;la<=3;la++){ const phi=la*.38, rr=Math.cos(phi)*GR; ctx.beginPath(); ctx.ellipse(c,c-Math.sin(phi)*cT*GR,rr,Math.max(.5,rr*sT),0,0,TAU); ctx.stroke(); }
    for(let m=0;m<5;m++){ const w=Math.abs(Math.cos(ang.globe+m*Math.PI/5)); ctx.beginPath(); ctx.ellipse(c,c,Math.max(.5,w*GR),GR,0,0,TAU); ctx.stroke(); }
    for(const q of globe){
      const x1=q.x*cA-q.z*sA, z1=q.x*sA+q.z*cA, y2=q.y*cT-z1*sT, z2=q.y*sT+z1*cT, d=(z2+1)/2;
      ctx.fillStyle=col(.12+d*.8*cur.glow); ctx.beginPath(); ctx.arc(c+x1*GR,c+y2*GR,.5+d*1.2,0,TAU); ctx.fill();
    }
    // cœur lumineux
    gr=ctx.createRadialGradient(c,c,0,c,c,R*.16);
    gr.addColorStop(0,`rgba(255,255,255,${.85*cur.glow})`); gr.addColorStop(1,col(0));
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(c,c,R*.16*(1+cur.vol*.5),0,TAU); ctx.fill();

    // orbite elliptique + 2 points
    ctx.save(); ctx.translate(c,c); ctx.rotate(-.2);
    const ox=R*.64, oy=R*.17; ctx.lineWidth=1.2; ctx.strokeStyle=col(.6*cur.glow+.15);
    ctx.beginPath(); ctx.ellipse(0,0,ox,oy,0,0,TAU); ctx.stroke();
    ctx.fillStyle=`rgba(255,255,255,${.9})`;
    for(let i=0;i<2;i++){ const a=ang.orbit+i*Math.PI; ctx.beginPath(); ctx.arc(Math.cos(a)*ox,Math.sin(a)*oy,2.6,0,TAU); ctx.fill(); }
    ctx.restore();

    // nom au centre
    ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font=`500 ${Math.max(12,S*.034)}px 'Segoe UI',system-ui,sans-serif`; if('letterSpacing' in ctx) ctx.letterSpacing=`${Math.max(4,S*.012)}px`;
    ctx.fillStyle=`rgba(235,245,255,${.78+cur.vol*.2})`; ctx.shadowColor=col(.9); ctx.shadowBlur=14;
    ctx.fillText('NEXUS',c+(('letterSpacing' in ctx)?S*.006:0),c); ctx.restore();

    // étincelles
    for(const s of sparks){ if(!reduce) s.a+=s.v*dt*cur.spin; const tw=.35+.65*Math.abs(Math.sin(t*s.s+s.p));
      ctx.fillStyle=col(.7*tw*cur.glow+.1); ctx.beginPath(); ctx.arc(c+Math.cos(s.a)*s.r*R,c+Math.sin(s.a)*s.r*R,1+tw*.9,0,TAU); ctx.fill(); }
  }
  requestAnimationFrame(frame);
})();

setPhase('idle');
connect();
</script>
