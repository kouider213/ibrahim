<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS — Agent IA PC</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#030310;--bg2:#07071a;--bg3:#0d0d28;
  --cyan:#00d4ff;--cyan2:#00a0cc;--purple:#7b2fff;
  --orange:#ff6b35;--green:#00ff88;--red:#ff3366;--gold:#ffd700;
  --text:#c8d8f0;--dim:#2a4060;--dim2:#4a6080;
  --glow:0 0 20px rgba(0,212,255,.5);
  --glow-sm:0 0 10px rgba(0,212,255,.4);
  --glow-lg:0 0 40px rgba(0,212,255,.35);
  --border:rgba(0,212,255,.1);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:'Courier New',Consolas,monospace;font-size:13px;-webkit-font-smoothing:antialiased}

/* ── BACKGROUND ─────────────────────────────────────── */
.bg-grid{position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(0,212,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,212,255,.018) 1px,transparent 1px);
  background-size:44px 44px}
.bg-radial{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 80% 55% at 50% -10%,rgba(0,212,255,.05) 0%,transparent 70%),
    radial-gradient(ellipse 50% 40% at 95% 100%,rgba(123,47,255,.04) 0%,transparent 60%)}
.scan-line{position:fixed;left:0;right:0;height:1px;pointer-events:none;z-index:99;
  background:linear-gradient(90deg,transparent,rgba(0,212,255,.15),transparent);
  animation:scan 10s linear infinite}

/* ── SHELL ───────────────────────────────────────────── */
.shell{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── HEADER ──────────────────────────────────────────── */
header{display:flex;align-items:center;justify-content:space-between;
  padding:8px 18px;border-bottom:1px solid var(--border);
  background:rgba(3,3,16,.95);backdrop-filter:blur(16px);flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px}
.brand-pulse{width:9px;height:9px;border-radius:50%;background:var(--cyan);
  box-shadow:var(--glow-sm);animation:pulse 2.2s ease-in-out infinite}
.brand-name{font-size:14px;font-weight:bold;letter-spacing:8px;color:var(--cyan);text-shadow:var(--glow-sm)}
.brand-sub{font-size:8px;letter-spacing:3px;color:var(--dim2)}
.hdr-right{display:flex;align-items:center;gap:20px}
.status-bar{display:flex;gap:14px;align-items:center}
.st{display:flex;align-items:center;gap:4px;font-size:8px;letter-spacing:1.5px;color:var(--dim2)}
.st-dot{width:5px;height:5px;border-radius:50%;background:var(--dim);transition:all .4s}
.st-dot.on{background:var(--green);box-shadow:0 0 6px var(--green)}
.st-dot.off{background:var(--orange);box-shadow:0 0 5px var(--orange)}
#clock{font-size:11px;letter-spacing:2px;color:var(--dim2)}

/* ── MAIN LAYOUT: 2 colonnes ─────────────────────────── */
.main{flex:1;display:flex;overflow:hidden;min-height:0}

/* ── COLONNE GAUCHE: Logo + chat ─────────────────────── */
.col-left{width:340px;flex-shrink:0;display:flex;flex-direction:column;
  border-right:1px solid var(--border);background:rgba(3,3,16,.6)}

.logo-wrap{display:flex;flex-direction:column;align-items:center;padding:16px 0 8px;flex-shrink:0}
.nexus-svg{width:130px;height:130px}
.ring-outer{animation:spin-cw 14s linear infinite;transform-origin:center}
.ring-inner{animation:spin-ccw 9s linear infinite;transform-origin:center}
.ring-med{animation:spin-cw 22s linear infinite;transform-origin:center}
.core-group{animation:core-pulse 3.5s ease-in-out infinite;transform-origin:center}

.waveform{display:flex;align-items:center;gap:3px;height:32px;margin-top:6px}
.wv-bar{width:4px;border-radius:3px;background:var(--cyan);height:4px;opacity:.2;transition:opacity .2s}
.waveform.active .wv-bar{opacity:1}
.waveform.active .wv-bar:nth-child(1){animation:wv .7s ease-in-out infinite 0s}
.waveform.active .wv-bar:nth-child(2){animation:wv .7s ease-in-out infinite .1s}
.waveform.active .wv-bar:nth-child(3){animation:wv .7s ease-in-out infinite .2s}
.waveform.active .wv-bar:nth-child(4){animation:wv .7s ease-in-out infinite .05s}
.waveform.active .wv-bar:nth-child(5){animation:wv .7s ease-in-out infinite .15s}
.waveform.active .wv-bar:nth-child(6){animation:wv .7s ease-in-out infinite .25s}
.waveform.active .wv-bar:nth-child(7){animation:wv .7s ease-in-out infinite .12s}
.waveform.active .wv-bar:nth-child(8){animation:wv .7s ease-in-out infinite .22s}

.agent-badge{font-size:8px;letter-spacing:3px;font-weight:bold;padding:3px 10px;
  border-radius:12px;background:rgba(123,47,255,.15);border:1px solid rgba(123,47,255,.4);
  color:var(--purple);text-shadow:0 0 8px var(--purple);display:none;margin-top:5px;
  animation:slide-down .3s ease}

.thinking-wrap{display:flex;align-items:center;gap:5px;height:18px;justify-content:center;margin-top:4px}
.thinking-wrap i{width:5px;height:5px;border-radius:50%;background:var(--cyan);opacity:0;
  animation:think 1.3s ease-in-out infinite}
.thinking-wrap i:nth-child(2){animation-delay:.22s}
.thinking-wrap i:nth-child(3){animation-delay:.44s}

/* ── Chat history (colonne gauche) ───────────────────── */
.chat-history{flex:1;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;
  gap:6px;scrollbar-width:thin;scrollbar-color:rgba(0,212,255,.15) transparent}
.chat-history::-webkit-scrollbar{width:3px}
.chat-history::-webkit-scrollbar-thumb{background:rgba(0,212,255,.15);border-radius:2px}
.chat-msg{padding:7px 10px;border-radius:6px;font-size:11px;line-height:1.55;
  animation:msg-in .25s ease;max-width:100%;word-break:break-word}
.chat-msg.nexus{background:rgba(0,212,255,.05);border-left:2px solid var(--cyan);color:var(--text)}
.chat-msg.user{background:rgba(123,47,255,.07);border-right:2px solid var(--purple);
  color:var(--text);align-self:flex-end;text-align:right}
.chat-role{font-size:8px;letter-spacing:2px;margin-bottom:3px;opacity:.6}
.chat-msg.nexus .chat-role{color:var(--cyan)}
.chat-msg.user .chat-role{color:var(--purple)}

/* ── COLONNE DROITE: Widgets + caméra ───────────────── */
.col-right{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:10px 12px;gap:8px}

/* ── Caméra widget ───────────────────────────────────── */
.camera-widget{border-radius:10px;border:1px solid var(--border);
  background:rgba(0,0,0,.5);overflow:hidden;position:relative;flex-shrink:0;
  display:none}
.camera-widget.active{display:block;animation:slide-down .4s ease}
#camera-img{width:100%;display:block;border-radius:9px}
.cam-label{position:absolute;top:8px;left:10px;font-size:8px;letter-spacing:2px;
  color:var(--cyan);background:rgba(0,0,0,.6);padding:2px 8px;border-radius:10px;
  border:1px solid rgba(0,212,255,.3)}
.cam-live-dot{width:6px;height:6px;border-radius:50%;background:var(--red);
  display:inline-block;margin-right:5px;animation:pulse 1s ease-in-out infinite}

/* ── Widgets row ─────────────────────────────────────── */
.widgets-row{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;flex-shrink:0;
  scrollbar-width:none}
.widgets-row::-webkit-scrollbar{display:none}

.widget{background:rgba(0,212,255,.04);border:1px solid var(--border);
  border-radius:10px;padding:10px 14px;min-width:120px;flex-shrink:0;
  position:relative;overflow:hidden;animation:slide-down .35s ease;
  transition:border-color .3s,box-shadow .3s}
.widget:hover{border-color:rgba(0,212,255,.25);box-shadow:var(--glow-sm)}
.wg-title{font-size:7px;letter-spacing:2.5px;color:var(--dim2);margin-bottom:5px}
.wg-val{font-size:22px;font-weight:bold;color:var(--text);line-height:1.1}
.wg-sub{font-size:9px;color:var(--dim2);margin-top:2px}
.disk-bar{height:3px;background:rgba(0,212,255,.1);border-radius:2px;margin-top:6px}
.disk-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--cyan),var(--purple));transition:width .6s ease}

/* Weather widget special */
.widget.weather-wg .wg-val{color:var(--gold)}
.widget.music-wg .wg-val{font-size:14px;color:var(--green);word-break:break-all}
.widget.railway-wg.ok .wg-val{color:var(--green)}
.widget.railway-wg.fail .wg-val{color:var(--red)}
.widget.bookings-wg .wg-val{color:var(--cyan)}

/* ── Status area ─────────────────────────────────────── */
.status-area{border:1px solid var(--border);border-radius:10px;
  background:rgba(0,212,255,.02);padding:10px 14px;flex-shrink:0}
.status-line{font-size:10px;letter-spacing:2px;color:var(--dim2);min-height:16px}
#status-text{transition:all .3s}

/* ── Input bar ───────────────────────────────────────── */
.input-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-top:1px solid var(--border);background:rgba(3,3,16,.98);flex-shrink:0}
.input-field{flex:1;background:rgba(0,212,255,.04);border:1px solid rgba(0,212,255,.12);
  border-radius:8px;padding:9px 13px;color:var(--text);font-family:inherit;font-size:13px;
  outline:none;transition:border-color .2s,box-shadow .2s}
.input-field:focus{border-color:rgba(0,212,255,.35);box-shadow:var(--glow-sm)}
.input-field::placeholder{color:var(--dim)}
.btn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(0,212,255,.2);
  background:rgba(0,212,255,.04);color:var(--cyan);font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.btn:hover{background:rgba(0,212,255,.12);border-color:rgba(0,212,255,.4)}
.btn.active{background:rgba(0,212,255,.2);box-shadow:var(--glow);animation:pulse 1s ease-in-out infinite}
.btn.cam-active{background:rgba(255,51,102,.15);border-color:rgba(255,51,102,.5);color:var(--red)}

/* ── Animations ──────────────────────────────────────── */
@keyframes spin-cw {to{transform:rotate(360deg)}}
@keyframes spin-ccw{to{transform:rotate(-360deg)}}
@keyframes core-pulse{
  0%,100%{filter:drop-shadow(0 0 8px rgba(0,212,255,.6));opacity:.85}
  50%{filter:drop-shadow(0 0 22px rgba(0,212,255,.95));opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes wv{0%,100%{height:3px}50%{height:26px}}
@keyframes slide-down{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes msg-in{from{opacity:0;transform:translateX(-5px)}to{opacity:1;transform:translateX(0)}}
@keyframes think{0%,60%,100%{opacity:0;transform:scale(1)}30%{opacity:1;transform:scale(1.3)}}
@keyframes scan{0%{top:-1px}100%{top:100vh}}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-radial"></div>
<div class="scan-line"></div>

<div class="shell">

  <!-- ── HEADER ── -->
  <header>
    <div class="brand">
      <div class="brand-pulse"></div>
      <div>
        <div class="brand-name">NEXUS</div>
        <div class="brand-sub">FIK CONCIERGERIE · ORAN</div>
      </div>
    </div>
    <div class="hdr-right">
      <div class="status-bar">
        <div class="st"><div class="st-dot" id="dot-backend"></div><span>BACKEND</span></div>
        <div class="st"><div class="st-dot" id="dot-local"></div><span>LOCAL</span></div>
        <div class="st"><div class="st-dot" id="dot-mic"></div><span>MIC</span></div>
        <div class="st"><div class="st-dot" id="dot-cam"></div><span>CAM</span></div>
      </div>
      <div id="clock"></div>
    </div>
  </header>

  <!-- ── MAIN ── -->
  <div class="main">

    <!-- Colonne gauche: logo + chat -->
    <div class="col-left">
      <div class="logo-wrap">
        <svg class="nexus-svg" viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="glow3"><feGaussianBlur stdDeviation="3" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            <filter id="glow6"><feGaussianBlur stdDeviation="6" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <circle cx="65" cy="65" r="60" fill="none" stroke="rgba(0,212,255,.07)" stroke-width="1"/>
          <g class="ring-outer">
            <circle cx="65" cy="65" r="56" fill="none" stroke="#00d4ff"
              stroke-width="1" stroke-dasharray="5 9" opacity=".45" filter="url(#glow3)"/>
            <rect x="62" y="7"  width="6" height="2" rx="1" fill="#00d4ff" opacity=".9"/>
            <rect x="62" y="121" width="6" height="2" rx="1" fill="#00d4ff" opacity=".9"/>
            <rect x="7"  y="62" width="2" height="6" rx="1" fill="#00d4ff" opacity=".9"/>
            <rect x="121" y="62" width="2" height="6" rx="1" fill="#00d4ff" opacity=".9"/>
          </g>
          <g class="ring-med">
            <circle cx="65" cy="65" r="48" fill="none" stroke="#7b2fff"
              stroke-width=".8" stroke-dasharray="14 7" opacity=".3" filter="url(#glow3)"/>
          </g>
          <g class="ring-inner">
            <circle cx="65" cy="65" r="40" fill="none" stroke="#00d4ff"
              stroke-width="1.5" stroke-dasharray="10 6" opacity=".5" filter="url(#glow3)"/>
            <circle cx="65" cy="25" r="2" fill="#00d4ff" opacity=".8"/>
            <circle cx="105" cy="65" r="2" fill="#00d4ff" opacity=".8"/>
            <circle cx="65" cy="105" r="2" fill="#00d4ff" opacity=".8"/>
            <circle cx="25"  cy="65" r="2" fill="#00d4ff" opacity=".8"/>
          </g>
          <line x1="65" y1="33" x2="65" y2="42" stroke="#00d4ff" stroke-width=".5" opacity=".3"/>
          <line x1="65" y1="88" x2="65" y2="97" stroke="#00d4ff" stroke-width=".5" opacity=".3"/>
          <line x1="33" y1="65" x2="42" y2="65" stroke="#00d4ff" stroke-width=".5" opacity=".3"/>
          <line x1="88" y1="65" x2="97" y2="65" stroke="#00d4ff" stroke-width=".5" opacity=".3"/>
          <g class="core-group" filter="url(#glow6)">
            <circle cx="65" cy="65" r="28" fill="rgba(0,212,255,.04)" stroke="#00d4ff" stroke-width="1.2" opacity=".7"/>
            <circle cx="65" cy="65" r="19" fill="rgba(0,212,255,.07)"/>
            <circle cx="65" cy="65" r="7"  fill="#00d4ff" opacity=".85"/>
            <circle cx="65" cy="65" r="3"  fill="#fff"    opacity=".6"/>
          </g>
          <text x="65" y="69" text-anchor="middle" font-family="'Courier New',monospace"
            font-size="9" font-weight="bold" letter-spacing="5"
            fill="#00d4ff" filter="url(#glow3)" opacity=".9">NEXUS</text>
        </svg>

        <div class="waveform" id="waveform">
          <div class="wv-bar"></div><div class="wv-bar"></div><div class="wv-bar"></div>
          <div class="wv-bar"></div><div class="wv-bar"></div><div class="wv-bar"></div>
          <div class="wv-bar"></div><div class="wv-bar"></div>
        </div>

        <div class="agent-badge" id="agent-badge"></div>
        <div class="thinking-wrap" id="think-wrap" style="display:none">
          <i></i><i></i><i></i>
        </div>
      </div>

      <!-- Chat history -->
      <div class="chat-history" id="chat-history">
        <!-- Populated by JS -->
      </div>
    </div>

    <!-- Colonne droite: widgets + caméra -->
    <div class="col-right">

      <!-- Caméra live -->
      <div class="camera-widget" id="camera-widget">
        <img id="camera-img" alt="camera"/>
        <div class="cam-label"><span class="cam-live-dot"></span>LIVE · NEXUS VISION</div>
      </div>

      <!-- Widgets row -->
      <div class="widgets-row" id="widgets-row">
        <!-- Populated by JS -->
      </div>

      <!-- Status -->
      <div class="status-area">
        <div class="status-line" id="status-text">━━━ NEXUS EN ATTENTE ━━━</div>
      </div>

    </div>
  </div>

  <!-- ── INPUT BAR ── -->
  <div class="input-bar">
    <input class="input-field" id="inp" type="text"
      placeholder="Parle à NEXUS… (Lacrim sur YouTube, météo, regarde-moi…)"
      autocomplete="off" spellcheck="false"/>
    <button class="btn" id="btn-cam"   title="Caméra (Ctrl+K)">📷</button>
    <button class="btn" id="btn-mic"   title="Micro (Ctrl+M)">🎤</button>
  </div>
</div>

<script>
const WS_URL = 'ws://localhost:7778';

const inp        = document.getElementById('inp');
const waveform   = document.getElementById('waveform');
const widgetsRow = document.getElementById('widgets-row');
const btnMic     = document.getElementById('btn-mic');
const btnCam     = document.getElementById('btn-cam');
const dotBE      = document.getElementById('dot-backend');
const dotLoc     = document.getElementById('dot-local');
const dotMic     = document.getElementById('dot-mic');
const dotCam     = document.getElementById('dot-cam');
const thinkWrap  = document.getElementById('think-wrap');
const statusTxt  = document.getElementById('status-text');
const agentBadge = document.getElementById('agent-badge');
const chatEl     = document.getElementById('chat-history');
const cameraWg   = document.getElementById('camera-widget');
const cameraImg  = document.getElementById('camera-img');

let ws = null, micActive = false, camActive = false;

// ── Clock ──────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}
setInterval(updateClock, 1000);
updateClock();

// ── WebSocket ──────────────────────────────────────────
function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen  = () => { setDot(dotLoc, true);  setStatus('━━━ NEXUS CONNECTÉ ━━━'); };
  ws.onclose = () => { setDot(dotLoc, false); setTimeout(connect, 2500); };
  ws.onerror = () => setDot(dotLoc, false);
  ws.onmessage = e => handle(JSON.parse(e.data));
}
function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

// ── Message handler ────────────────────────────────────
function handle(d) {
  switch (d.type) {

    case 'speak':
      showThink(false);
      setStatus('NEXUS PARLE…');
      break;

    case 'waveform':
      waveform.classList.toggle('active', !!d.active);
      if (!d.active) setStatus('EN ATTENTE');
      break;

    case 'thinking':
      showThink(!!d.active);
      if (d.active) setStatus('RÉFLEXION…');
      break;

    case 'status':
      if (d.backend !== undefined) setDot(dotBE, d.backend);
      if (d.text) {
        setStatus(d.text);
        const m = d.text.match(/^AGENT\s+(\w+)/i);
        if (m) showAgent(m[1]); else hideAgent();
      }
      break;

    case 'widget':
      renderWidget(d.widget, d.data);
      break;

    case 'journal':
      setStatus('📡 ' + d.text.slice(0, 60));
      break;

    case 'chat_history':
      renderChat(d.history || []);
      break;

    case 'camera_frame':
      if (d.data) {
        cameraWg.classList.add('active');
        camActive = true;
        setDot(dotCam, true);
        btnCam.classList.add('cam-active');
        cameraImg.src = 'data:image/jpeg;base64,' + d.data;
      } else {
        cameraWg.classList.remove('active');
        camActive = false;
        setDot(dotCam, false);
        btnCam.classList.remove('cam-active');
      }
      break;
  }
}

// ── Chat history ───────────────────────────────────────
function renderChat(history) {
  chatEl.innerHTML = '';
  history.forEach(m => {
    const div  = document.createElement('div');
    div.className = 'chat-msg ' + (m.role === 'nexus' ? 'nexus' : 'user');
    const role = document.createElement('div');
    role.className = 'chat-role';
    role.textContent = m.role === 'nexus' ? '◉ NEXUS' : '▸ TOI';
    const txt = document.createElement('div');
    txt.textContent = m.text.slice(0, 200) + (m.text.length > 200 ? '…' : '');
    div.appendChild(role);
    div.appendChild(txt);
    chatEl.appendChild(div);
  });
  chatEl.scrollTop = chatEl.scrollHeight;
}

// ── Widgets ────────────────────────────────────────────
function renderWidget(type, data) {
  const old = document.querySelector(`[data-wg="${type}"]`);
  if (old) old.remove();

  const w = document.createElement('div');
  w.className = 'widget';
  w.dataset.wg = type;

  if (type === 'disk') {
    const pct  = data.pct;
    const free = (data.free / 1e9).toFixed(1);
    const color = pct > 85 ? 'var(--orange)' : pct > 70 ? 'var(--gold)' : 'var(--cyan)';
    w.innerHTML = `<div class="wg-title">DISQUE C:</div>
      <div class="wg-val" style="color:${color}">${pct}%</div>
      <div class="wg-sub">${free} GB libres</div>
      <div class="disk-bar"><div class="disk-fill" style="width:${pct}%"></div></div>`;
  }
  else if (type === 'weather') {
    w.classList.add('weather-wg');
    w.innerHTML = `<div class="wg-title">MÉTÉO ORAN</div>
      <div class="wg-val">${data.temp}°C</div>
      <div class="wg-sub">${data.desc}</div>`;
  }
  else if (type === 'bookings') {
    w.classList.add('bookings-wg');
    w.innerHTML = `<div class="wg-title">RÉSERVATIONS</div>
      <div class="wg-val">${data.count}</div>
      <div class="wg-sub">actives aujourd'hui</div>`;
  }
  else if (type === 'railway') {
    const ok = data.status === 'ok';
    w.classList.add('railway-wg', ok ? 'ok' : 'fail');
    w.innerHTML = `<div class="wg-title">RAILWAY</div>
      <div class="wg-val">${ok ? '●' : '✗'}</div>
      <div class="wg-sub">${ok ? 'en ligne' : 'hors ligne'}</div>`;
  }
  else if (type === 'music') {
    w.classList.add('music-wg');
    const icon = data.platform === 'youtube' ? '▶ YT' : '♫ SP';
    w.innerHTML = `<div class="wg-title">MUSIQUE ${icon}</div>
      <div class="wg-val">${data.query}</div>
      <div class="wg-sub">en cours</div>`;
  }
  else {
    w.innerHTML = `<div class="wg-title">${type.toUpperCase()}</div>
      <div class="wg-val" style="font-size:12px">${JSON.stringify(data)}</div>`;
  }

  widgetsRow.appendChild(w);
}

// ── Status helpers ─────────────────────────────────────
function setStatus(t) { statusTxt.textContent = t.toUpperCase().slice(0, 90); }
function showThink(on) { thinkWrap.style.display = on ? 'flex' : 'none'; }
function setDot(el, on) { el.className = 'st-dot ' + (on ? 'on' : 'off'); }
function showAgent(name) {
  agentBadge.textContent = '⬡ AGENT ' + name.toUpperCase();
  agentBadge.style.display = 'block';
}
function hideAgent() { agentBadge.style.display = 'none'; }

// ── Input ──────────────────────────────────────────────
function sendMsg(text) {
  text = text.trim();
  if (!text) return;
  showThink(true);
  send({ type: 'message', text });
}
inp.addEventListener('keydown', e => {
  if (e.key === 'Enter') { sendMsg(inp.value); inp.value = ''; }
  if (e.key === 'Escape') inp.blur();
});

// ── Mic ────────────────────────────────────────────────
function toggleMic() {
  micActive = !micActive;
  btnMic.classList.toggle('active', micActive);
  setDot(dotMic, micActive);
  send({ type: 'mic_toggle', active: micActive });
}
btnMic.addEventListener('click', toggleMic);

// ── Camera ─────────────────────────────────────────────
function toggleCam() {
  send({ type: 'camera_toggle' });
}
btnCam.addEventListener('click', toggleCam);

// ── Keyboard shortcuts ─────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'm') { e.preventDefault(); toggleMic(); }
  if (e.ctrlKey && e.key === 'k') { e.preventDefault(); toggleCam(); }
  if (e.ctrlKey && e.key === 'd') { e.preventDefault(); send({ type: 'widget_request', widget: 'disk' }); }
  if (!e.ctrlKey && !e.altKey && !e.metaKey && e.key.length === 1) inp.focus();
});

// ── Boot ───────────────────────────────────────────────
connect();
</script>
</body>
</html>
