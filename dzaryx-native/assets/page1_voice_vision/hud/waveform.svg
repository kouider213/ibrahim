<?xml version="1.0" encoding="UTF-8"?>
<!-- Audio waveform bars — 24 bars, amplitude varies by position -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" fill="none">
<defs>
  <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
    <feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="bar" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#00d4ff44"/>
  </linearGradient>
</defs>
<!-- 24 bars at x positions 6,18,30,42,54,66... (step=12) heights vary -->
<rect x="6"   y="32" width="6" height="16" rx="3" fill="url(#bar)" opacity="0.5"/>
<rect x="18"  y="26" width="6" height="28" rx="3" fill="url(#bar)" opacity="0.6"/>
<rect x="30"  y="20" width="6" height="40" rx="3" fill="url(#bar)" opacity="0.75"/>
<rect x="42"  y="14" width="6" height="52" rx="3" fill="url(#bar)" opacity="0.85"/>
<rect x="54"  y="8"  width="6" height="64" rx="3" fill="url(#bar)" opacity="0.95" filter="url(#glow)"/>
<rect x="66"  y="14" width="6" height="52" rx="3" fill="url(#bar)" opacity="0.9"/>
<rect x="78"  y="20" width="6" height="40" rx="3" fill="url(#bar)" opacity="0.8"/>
<rect x="90"  y="10" width="6" height="60" rx="3" fill="url(#bar)" opacity="0.9" filter="url(#glow)"/>
<rect x="102" y="18" width="6" height="44" rx="3" fill="url(#bar)" opacity="0.78"/>
<rect x="114" y="6"  width="6" height="68" rx="3" fill="url(#bar)" opacity="1.0" filter="url(#glow)"/>
<rect x="126" y="12" width="6" height="56" rx="3" fill="url(#bar)" opacity="0.92"/>
<rect x="138" y="22" width="6" height="36" rx="3" fill="url(#bar)" opacity="0.75"/>
<rect x="150" y="16" width="6" height="48" rx="3" fill="url(#bar)" opacity="0.85"/>
<rect x="162" y="8"  width="6" height="64" rx="3" fill="url(#bar)" opacity="0.95" filter="url(#glow)"/>
<rect x="174" y="18" width="6" height="44" rx="3" fill="url(#bar)" opacity="0.82"/>
<rect x="186" y="24" width="6" height="32" rx="3" fill="url(#bar)" opacity="0.7"/>
<rect x="198" y="14" width="6" height="52" rx="3" fill="url(#bar)" opacity="0.85"/>
<rect x="210" y="20" width="6" height="40" rx="3" fill="url(#bar)" opacity="0.75"/>
<rect x="222" y="26" width="6" height="28" rx="3" fill="url(#bar)" opacity="0.65"/>
<rect x="234" y="18" width="6" height="44" rx="3" fill="url(#bar)" opacity="0.72"/>
<rect x="246" y="24" width="6" height="32" rx="3" fill="url(#bar)" opacity="0.62"/>
<rect x="258" y="28" width="6" height="24" rx="3" fill="url(#bar)" opacity="0.55"/>
<rect x="270" y="32" width="6" height="16" rx="3" fill="url(#bar)" opacity="0.48"/>
<rect x="282" y="36" width="6" height="8"  rx="3" fill="url(#bar)" opacity="0.38"/>
</svg>
