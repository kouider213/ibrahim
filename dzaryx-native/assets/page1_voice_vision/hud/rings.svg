<?xml version="1.0" encoding="UTF-8"?>
<!-- Holographic concentric rings — animate rotation in React Native -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
<defs>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<!-- Ring 1 — inner solid -->
<circle cx="200" cy="200" r="80" fill="none" stroke="#00d4ff" stroke-width="1.2" opacity="0.7" filter="url(#glow)"/>
<!-- Ring 2 — dashed -->
<circle cx="200" cy="200" r="110" fill="none" stroke="#00d4ff" stroke-width="0.9" stroke-dasharray="8 5" opacity="0.55"/>
<!-- Ring 3 — outer dashed segments -->
<circle cx="200" cy="200" r="145" fill="none" stroke="#00d4ff" stroke-width="0.8" stroke-dasharray="14 8" opacity="0.4"/>
<!-- Ring 4 — outer glow ring -->
<circle cx="200" cy="200" r="180" fill="none" stroke="#00d4ff" stroke-width="0.6" stroke-dasharray="20 12" opacity="0.25"/>
<!-- Cross hairs -->
<line x1="200" y1="70"  x2="200" y2="118" stroke="#00d4ff" stroke-width="0.8" opacity="0.4"/>
<line x1="200" y1="282" x2="200" y2="330" stroke="#00d4ff" stroke-width="0.8" opacity="0.4"/>
<line x1="70"  y1="200" x2="118" y2="200" stroke="#00d4ff" stroke-width="0.8" opacity="0.4"/>
<line x1="282" y1="200" x2="330" y2="200" stroke="#00d4ff" stroke-width="0.8" opacity="0.4"/>
<!-- Tick marks on outer ring -->
<line x1="200" y1="20"  x2="200" y2="32"  stroke="#00d4ff" stroke-width="1.2" opacity="0.5" filter="url(#glow)"/>
<line x1="200" y1="368" x2="200" y2="380" stroke="#00d4ff" stroke-width="1.2" opacity="0.5" filter="url(#glow)"/>
<line x1="20"  y1="200" x2="32"  y2="200" stroke="#00d4ff" stroke-width="1.2" opacity="0.5" filter="url(#glow)"/>
<line x1="368" y1="200" x2="380" y2="200" stroke="#00d4ff" stroke-width="1.2" opacity="0.5" filter="url(#glow)"/>
<!-- Dot markers at 45deg positions -->
<circle cx="297" cy="103" r="2.5" fill="#00d4ff" opacity="0.5"/>
<circle cx="103" cy="103" r="2.5" fill="#00d4ff" opacity="0.5"/>
<circle cx="297" cy="297" r="2.5" fill="#00d4ff" opacity="0.5"/>
<circle cx="103" cy="297" r="2.5" fill="#00d4ff" opacity="0.5"/>
</svg>
