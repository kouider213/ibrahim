<?xml version="1.0" encoding="UTF-8"?>
<!-- Radar scan overlay — rotate sweep line in React Native -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
<defs>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <radialGradient id="sweep" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#9b59b6"/><stop offset="100%" stop-color="#9b59b600"/>
  </radialGradient>
</defs>
<!-- Grid circles -->
<circle cx="150" cy="150" r="40"  fill="none" stroke="#9b59b6" stroke-width="0.7" opacity="0.35"/>
<circle cx="150" cy="150" r="80"  fill="none" stroke="#9b59b6" stroke-width="0.7" opacity="0.28"/>
<circle cx="150" cy="150" r="120" fill="none" stroke="#9b59b6" stroke-width="0.6" opacity="0.2"/>
<!-- Cross hairs -->
<line x1="150" y1="30"  x2="150" y2="270" stroke="#9b59b6" stroke-width="0.5" opacity="0.2"/>
<line x1="30"  y1="150" x2="270" y2="150" stroke="#9b59b6" stroke-width="0.5" opacity="0.2"/>
<line x1="65"  y1="65"  x2="235" y2="235" stroke="#9b59b6" stroke-width="0.4" opacity="0.15"/>
<line x1="235" y1="65"  x2="65"  y2="235" stroke="#9b59b6" stroke-width="0.4" opacity="0.15"/>
<!-- Sweep sector (static wedge — animate rotation in RN) -->
<path d="M 150 150 L 150 30 A 120 120 0 0 1 254 85 Z" fill="url(#sweep)" opacity="0.18"/>
<line x1="150" y1="150" x2="150" y2="30"  stroke="#9b59b6" stroke-width="1.5" opacity="0.7" filter="url(#glow)"/>
<!-- Center dot -->
<circle cx="150" cy="150" r="4" fill="#9b59b6" opacity="0.9" filter="url(#glow)"/>
<circle cx="150" cy="150" r="2" fill="white" opacity="0.6"/>
<!-- Target blips (dots) -->
<circle cx="185" cy="112" r="3.5" fill="#9b59b6" opacity="0.8" filter="url(#glow)"/>
<circle cx="115" cy="175" r="2.5" fill="#9b59b6" opacity="0.6"/>
<circle cx="200" cy="165" r="2"   fill="#9b59b6" opacity="0.5"/>
<!-- Tick marks -->
<line x1="150" y1="27"  x2="150" y2="33"  stroke="#9b59b6" stroke-width="1.2" opacity="0.6" filter="url(#glow)"/>
<line x1="150" y1="267" x2="150" y2="273" stroke="#9b59b6" stroke-width="1.2" opacity="0.6" filter="url(#glow)"/>
<line x1="27"  y1="150" x2="33"  y2="150" stroke="#9b59b6" stroke-width="1.2" opacity="0.6" filter="url(#glow)"/>
<line x1="267" y1="150" x2="273" y2="150" stroke="#9b59b6" stroke-width="1.2" opacity="0.6" filter="url(#glow)"/>
</svg>
