<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="doc" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ff6b00"/><stop offset="100%" stop-color="#cc4400"/>
  </linearGradient>
</defs>
<!-- Document background -->
<rect x="12" y="6" width="34" height="44" rx="4" fill="#ff6b0008"/>
<!-- Document outline -->
<rect x="12" y="6" width="34" height="44" rx="4" fill="none" stroke="#ff6b00" stroke-width="1.5" filter="url(#glow)" opacity="0.85"/>
<!-- Doc fold corner -->
<path d="M 36 6 L 46 16" fill="none" stroke="#ff6b00" stroke-width="1.2" opacity="0.6"/>
<path d="M 36 6 L 36 16 L 46 16" fill="#ff6b0012" stroke="none"/>
<!-- Text lines on document -->
<line x1="18" y1="24" x2="40" y2="24" stroke="#ff6b00" stroke-width="1" opacity="0.5"/>
<line x1="18" y1="30" x2="40" y2="30" stroke="#ff6b00" stroke-width="1" opacity="0.5"/>
<line x1="18" y1="36" x2="32" y2="36" stroke="#ff6b00" stroke-width="1" opacity="0.4"/>
<!-- Scan beam line -->
<line x1="6" y1="32" x2="58" y2="32" stroke="#ff6b00" stroke-width="1.8" stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>
<!-- Scan endpoints glow dots -->
<circle cx="8"  cy="32" r="3" fill="#ff6b00" opacity="0.7" filter="url(#glow)"/>
<circle cx="56" cy="32" r="3" fill="#ff6b00" opacity="0.7" filter="url(#glow)"/>
<!-- Corner scan brackets on doc -->
<path d="M 12 20 L 12 14 L 18 14" fill="none" stroke="#ff6b00" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
<path d="M 46 20 L 46 14 L 40 14" fill="none" stroke="#ff6b00" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
<path d="M 12 42 L 12 48 L 18 48" fill="none" stroke="#ff6b00" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
<path d="M 46 42 L 46 48 L 40 48" fill="none" stroke="#ff6b00" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
</svg>
