<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <radialGradient id="iris" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ddb8ff"/><stop offset="55%" stop-color="#9b59b6"/><stop offset="100%" stop-color="#9b59b600"/>
  </radialGradient>
</defs>
<!-- Eyelid outer glow -->
<path d="M 6 32 Q 32 8 58 32 Q 32 56 6 32 Z" fill="#9b59b6" opacity="0.04" filter="url(#glow)"/>
<!-- Eyelid shape upper -->
<path d="M 7 32 Q 32 10 57 32" fill="none" stroke="#9b59b6" stroke-width="1.6" stroke-linecap="round" filter="url(#glow)"/>
<!-- Eyelid shape lower -->
<path d="M 7 32 Q 32 52 57 32" fill="none" stroke="#9b59b6" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)"/>
<!-- Iris -->
<circle cx="32" cy="32" r="12" fill="url(#iris)" opacity="0.9"/>
<!-- Iris ring -->
<circle cx="32" cy="32" r="12" fill="none" stroke="#9b59b6" stroke-width="1" opacity="0.6"/>
<!-- Inner iris ring -->
<circle cx="32" cy="32" r="7" fill="none" stroke="#ddb8ff" stroke-width="0.8" opacity="0.5"/>
<!-- Pupil -->
<circle cx="32" cy="32" r="4.5" fill="#2d0845" opacity="0.95"/>
<!-- Aperture lines -->
<line x1="32" y1="20" x2="32" y2="23" stroke="#9b59b6" stroke-width="1" opacity="0.6"/>
<line x1="32" y1="41" x2="32" y2="44" stroke="#9b59b6" stroke-width="1" opacity="0.6"/>
<line x1="20" y1="32" x2="23" y2="32" stroke="#9b59b6" stroke-width="1" opacity="0.6"/>
<line x1="41" y1="32" x2="44" y2="32" stroke="#9b59b6" stroke-width="1" opacity="0.6"/>
<!-- Specular highlight -->
<circle cx="28" cy="28" r="2.5" fill="white" opacity="0.55"/>
<!-- Scan line across eye -->
<line x1="14" y1="32" x2="50" y2="32" stroke="#9b59b6" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.3"/>
</svg>
