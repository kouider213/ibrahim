<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#0088aa"/>
  </linearGradient>
</defs>
<!-- Outer glow -->
<rect x="20" y="6" width="24" height="32" rx="12" fill="#00d4ff" opacity="0.06" filter="url(#glow)"/>
<!-- Mic body fill -->
<rect x="21" y="7" width="22" height="30" rx="11" fill="#00d4ff12"/>
<!-- Mic body outline -->
<rect x="21" y="7" width="22" height="30" rx="11" fill="none" stroke="url(#body)" stroke-width="1.6" filter="url(#glow)"/>
<!-- Center ridge -->
<line x1="32" y1="10" x2="32" y2="34" stroke="#00d4ff" stroke-width="0.8" opacity="0.35"/>
<!-- Horizontal frequency marks -->
<line x1="24" y1="18" x2="40" y2="18" stroke="#00d4ff" stroke-width="0.7" opacity="0.3"/>
<line x1="24" y1="24" x2="40" y2="24" stroke="#00d4ff" stroke-width="0.7" opacity="0.3"/>
<!-- Stand arc -->
<path d="M 13 32 Q 13 52 32 52 Q 51 52 51 32" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>
<!-- Stem -->
<line x1="32" y1="52" x2="32" y2="59" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
<!-- Base -->
<line x1="22" y1="59" x2="42" y2="59" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)" opacity="0.85"/>
</svg>
