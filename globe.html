<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Dzaryx — Globe</title>
<script>window.CESIUM_BASE_URL = 'https://cdn.jsdelivr.net/npm/cesium@1.121.0/Build/Cesium/';</script>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.121.0/Build/Cesium/Cesium.js"></script>
<script src="https://cdn.jsdelivr.net/npm/satellite.js@6.0.1/dist/satellite.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.121.0/Build/Cesium/Widgets/widgets.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--line:rgba(90,150,255,.34);--text:#e8f0ff;--dim:#8ea3c8;--cyan:#38d8f5;--blue:#4aa3ff;--gold:#fbbf24;--card:rgba(6,12,30,.82)}
html,body{height:100%;overflow:hidden;background:#02050d;color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
#globe{position:absolute;inset:0}
.cesium-widget-credits{opacity:.45;font-size:9px!important}
.hud{position:absolute;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;backdrop-filter:blur(6px);
  box-shadow:0 0 24px rgba(56,216,245,.12) inset}
#clock{top:14px;left:14px;min-width:210px}
#clock .t{font-size:26px;font-weight:700;letter-spacing:.5px}
#clock .s{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.5}
#wx{top:14px;right:14px;min-width:200px;display:none}
#wx .n{font-size:20px;font-weight:700}
#wx .s{font-size:12.5px;color:var(--dim);line-height:1.6;margin-top:3px}
#wx .big{font-size:15px;color:var(--text)}
#info{top:52px;left:50%;transform:translateX(-50%);display:none;font-size:13px;white-space:nowrap}
#info.pl{white-space:normal;max-width:min(92vw,420px);line-height:1.45}#info .pc-h{font-size:14px}#info .pc-r{font-size:14px;margin:2px 0}#info .dim{color:var(--dim)}#info .pc-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.15);margin:6px 0 4px}#info .pc-bar i{display:block;height:100%;border-radius:2px;background:var(--gold)}#info .pc-img{display:block;margin-top:6px;width:100%;max-height:110px;object-fit:cover;border-radius:8px}
/* Widget vols (côté droit, sous la météo) */
#flights{top:164px;right:14px;width:310px;max-height:calc(100% - 340px);display:none;flex-direction:column;padding:0;overflow:hidden}
#flights.on{display:flex}
.whead{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}
.whead b{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whead button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:7px;min-width:26px;height:24px;cursor:pointer;font-size:12px}
.whead button:hover{color:var(--text);border-color:var(--cyan)}
#fl-sub{font-size:11.5px;color:var(--dim);padding:6px 12px 2px}
#fl-list{overflow:auto;padding:4px 6px 8px}
.fl{padding:7px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.fl:hover,.fl.sel{background:rgba(56,216,245,.08);border-color:rgba(56,216,245,.35)}
.fl .r1{display:flex;gap:8px;align-items:baseline}.fl .cs{font-weight:700;color:var(--gold)}.fl .al{flex:1;font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl .eta{font-weight:700;font-size:13px;color:var(--cyan)}.fl .r2{font-size:12.5px;margin-top:2px}.fl .r3{font-size:11.5px;color:var(--dim);margin-top:1px}
/* Widget caméra (sous le globe) */
#cam{bottom:66px;left:50%;transform:translateX(-50%);width:min(400px,40vw);display:none;padding:0;overflow:hidden;transition:width .3s}
#cam.on{display:block}#cam.big{width:min(820px,70vw)}
#cam .media{position:relative;aspect-ratio:16/9;background:#000}
#cam .media img,#cam .media video,#cam .media iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
#cam .live{position:absolute;top:8px;left:8px;background:rgba(220,30,50,.85);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:1px;padding:2px 7px;border-radius:5px}
#cam .meta{font-size:11.5px;color:var(--dim);padding:6px 12px 8px}
/* Liste des caméras du monde (côté gauche, sous l'horloge) */
#camlist{top:104px;left:14px;width:320px;max-height:calc(100% - 190px);display:none;flex-direction:column;padding:0;overflow:hidden}
#camlist.on{display:flex}
#cl-sub{font-size:11.5px;color:var(--dim);padding:6px 12px 4px;line-height:1.45}
#cl-q{margin:2px 10px 6px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);font:inherit;font-size:12.5px;outline:none}
#cl-q:focus{border-color:var(--cyan)}
#cl-list{overflow:auto;padding:2px 6px 8px}
.cl .r1{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl .n{color:var(--cyan);font-weight:700;margin-right:6px}
/* Bandeau de caméras par catégorie (sous le globe, au-dessus des boutons) */
#strip{bottom:66px;left:50%;transform:translateX(-50%);width:min(1040px,88vw);display:none;padding:0;overflow:hidden;border-color:rgba(74,222,128,.55);box-shadow:0 0 22px rgba(74,222,128,.18)}
#strip.on{display:block}
body.strip #cam{bottom:226px}
#st-tabs{display:flex;gap:5px;flex-wrap:nowrap;overflow-x:auto;padding:7px 10px 5px;scrollbar-width:none}
#st-tabs::-webkit-scrollbar{display:none}
#st-tabs button{white-space:nowrap;font:inherit;font-size:11.5px;font-weight:700;color:var(--dim);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer}
#st-tabs button.on{color:#02130a;background:#4ade80;border-color:#4ade80}
#st-tabs .info{margin-left:auto;font-size:11px;color:var(--dim);align-self:center;white-space:nowrap;padding-left:8px}
#st-row{display:flex;gap:8px;overflow-x:auto;padding:4px 10px 10px;scrollbar-width:thin}
.th{flex:0 0 156px;cursor:pointer;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#000;position:relative}
.th:hover,.th.sel,.th.ghover{border-color:#4ade80;box-shadow:0 0 12px rgba(74,222,128,.4)}
.th img{display:block;width:156px;height:88px;object-fit:cover}
.th div{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 4px;font-size:10.5px;line-height:1.25;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ghover{outline:2px solid #4ade80;outline-offset:1px}
/* Intro holographique */
#intro{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:radial-gradient(circle at 50% 45%,#06203f 0,#02050d 62%);transition:opacity .9s}
#intro.out{opacity:0;pointer-events:none}
#intro .core{position:relative;width:220px;height:220px;perspective:600px}
#intro .orb{position:absolute;inset:62px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#dffbff 0,#38d8f5 18%,#0d5fb8 55%,rgba(13,95,184,0) 72%);box-shadow:0 0 60px #38d8f5,0 0 120px rgba(56,216,245,.45);animation:pulse 1.6s ease-in-out infinite}
#intro i{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(56,216,245,.7);box-shadow:0 0 14px rgba(56,216,245,.6)}
#intro .r1{animation:spinA 3.2s linear infinite}#intro .r2{inset:18px;border-color:rgba(120,255,200,.55);animation:spinB 2.4s linear infinite}
#intro .r3{inset:-26px;border-style:dashed;border-color:rgba(56,216,245,.35);animation:spinC 9s linear infinite}
#intro .lbl{font-size:15px;letter-spacing:9px;color:#bfefff;text-shadow:0 0 12px #38d8f5}
#intro .bar{width:220px;height:3px;background:rgba(56,216,245,.15);border-radius:3px;overflow:hidden}
#intro .bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,#38d8f5,#7affc8);box-shadow:0 0 10px #38d8f5;animation:load 2.3s ease-out forwards}
@keyframes spinA{from{transform:rotateX(68deg) rotateZ(0)}to{transform:rotateX(68deg) rotateZ(360deg)}}
@keyframes spinB{from{transform:rotateY(64deg) rotateZ(0)}to{transform:rotateY(64deg) rotateZ(-360deg)}}
@keyframes spinC{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.08);filter:brightness(1.25)}}
@keyframes load{to{width:100%}}
#layers{bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px}
#layers button{white-space:nowrap;font:inherit;font-size:12px;font-weight:700;color:var(--dim);background:rgba(255,255,255,.04);border:1px solid var(--line);
  border-radius:999px;padding:6px 11px;cursor:pointer}
#layers button.on{color:#02050d;background:var(--cyan);border-color:var(--cyan)}
#zoomctl{right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;padding:6px}
#zoomctl button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(74,163,255,.15);color:var(--text);font-size:17px;cursor:pointer}
#toast{position:absolute;z-index:6;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--card);border:1px solid var(--cyan);border-radius:12px;
  padding:12px 18px;font-size:15px;display:none;max-width:70%;text-align:center}
#ring{position:absolute;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(circle at 50% 50%,transparent 38%,rgba(56,216,245,.07) 46%,transparent 56%)}

/* ── Barre de recherche + actions (version app) ── */
#search{top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 20px));display:flex;gap:6px;padding:6px}
#search input{flex:1;min-width:0;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);font:inherit;font-size:15px;outline:none}
#search input:focus{border-color:var(--cyan)}
#search button{padding:0 14px;border-radius:9px;border:1px solid var(--cyan);background:rgba(56,216,245,.16);color:var(--cyan);font:inherit;font-weight:700;font-size:14px}
#acts{position:absolute;z-index:5;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 20px));display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#acts::-webkit-scrollbar{display:none}
#acts button{flex:0 0 auto;white-space:nowrap;font:inherit;font-size:12.5px;font-weight:600;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;backdrop-filter:blur(6px)}
#acts button:active{border-color:var(--cyan);color:var(--cyan)}
#clock{top:calc(112px + env(safe-area-inset-top))}
#wx{top:calc(112px + env(safe-area-inset-top))}
#info{top:calc(112px + env(safe-area-inset-top))}
@media (max-width:700px){
  .hud{padding:8px 11px;border-radius:12px}
  #clock{display:none}
  #wx{right:10px;min-width:0;max-width:62%}
  #wx .n{font-size:15px}#wx .s{font-size:11.5px;line-height:1.5}#wx .big{font-size:13px}
  #info{left:10px;right:10px;transform:none;white-space:normal;font-size:12.5px;top:calc(205px + env(safe-area-inset-top))}
  #layers{left:10px;right:10px;transform:none;bottom:calc(10px + env(safe-area-inset-bottom));overflow-x:auto;scrollbar-width:none;padding:5px}
  #layers::-webkit-scrollbar{display:none}
  #layers button{font-size:11.5px;padding:7px 10px}
  #zoomctl{right:10px;top:42%;bottom:auto;padding:4px}
  #zoomctl button{width:36px;height:36px}
  #flights,#camlist{left:8px;right:8px;width:auto;top:auto;bottom:calc(64px + env(safe-area-inset-bottom));max-height:44%}
  #cam{left:8px;right:8px;width:auto;transform:none;bottom:calc(64px + env(safe-area-inset-bottom))}
  #cam.big{width:auto}
  #strip{left:8px;right:8px;width:auto;transform:none;bottom:calc(64px + env(safe-area-inset-bottom))}
  body.strip #cam{bottom:calc(210px + env(safe-area-inset-bottom))}
  .th{flex-basis:128px}.th img{width:128px;height:72px}
  #toast{max-width:86%;font-size:14px}
  .whead button{min-width:32px;height:30px;font-size:14px}
}
</style>
</head>
<body>
<div id="globe"></div>
<div id="ring"></div>
<div id="intro"><div class="core"><i class="r3"></i><i class="r1"></i><i class="r2"></i><div class="orb"></div></div><div class="lbl">D Z A R Y X</div><div class="bar"><b></b></div></div>
<div class="hud" id="search"><input id="q" type="search" enterkeyhint="go" placeholder="Ville, pays, aéroport…" aria-label="Lieu"><button id="go">Aller</button></div>
<div id="acts">
  <button data-a="in">✈️ Vols vers…</button><button data-a="out">🛫 Départs de…</button><button data-a="cams">📷 Caméras ici</button>
  <button data-a="world">🌍 Caméras du monde</button><button data-a="strip">🎞 Par catégorie</button><button data-a="events">📡 Que se passe-t-il ?</button>
</div>
<div class="hud" id="clock"><div class="t" id="c-time">--:--</div><div class="s" id="c-sub"></div></div>
<div class="hud" id="wx"><div class="n" id="wx-name"></div><div class="s" id="wx-body"></div></div>
<div class="hud" id="info"></div>
<div class="hud" id="flights" role="region" aria-label="Vols"><div class="whead"><b id="fl-title">✈️ Vols</b><button id="fl-x" title="Fermer">✕</button></div><div id="fl-sub"></div><div id="fl-list"></div></div>
<div class="hud" id="camlist" role="region" aria-label="Caméras du monde"><div class="whead"><b id="cl-title">🌍 Caméras du monde</b><button id="cl-x" title="Fermer">✕</button></div><div id="cl-sub"></div><input id="cl-q" type="search" placeholder="Rechercher une ville, un pays…" aria-label="Rechercher une caméra"><div id="cl-list"></div></div>
<div class="hud" id="strip" role="region" aria-label="Caméras par catégorie"><div id="st-tabs"></div><div id="st-row"></div></div>
<div class="hud" id="cam" role="region" aria-label="Caméra"><div class="whead"><b id="cam-title">📷</b><button id="cam-prev" title="Caméra précédente">◀</button><button id="cam-next" title="Caméra suivante">▶</button><button id="cam-big" title="Agrandir">⤢</button><button id="cam-x" title="Fermer">✕</button></div><div class="media" id="cam-media"></div><div class="meta" id="cam-meta"></div></div>
<div class="hud" id="layers">
  <button data-l="view">🛰 Vue satellite</button>
  <button data-l="spin">🌀 Rotation</button>
  <button data-l="planes">✈️ Avions</button>
  <button data-l="quakes">🌋 Séismes</button>
  <button data-l="sats">🛰️ Satellites</button>
  <button data-l="cams">📷 Caméras</button>
  <button data-l="weather">🌤 Météo</button>
</div>
<div class="hud" id="zoomctl"><button id="z-in" title="Zoom avant">+</button><button id="z-out" title="Zoom arrière">−</button><button id="z-home" title="Vue d'ensemble">⌂</button></div>
<div id="toast"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const state = { view: 'holo', spin: true, planes: false, quakes: false, sats: false, weather: true, cams: false };
const data = { planes: [], quakes: [], sats: [] };
const WX = {0:'Ciel clair',1:'Peu nuageux',2:'Nuageux',3:'Couvert',45:'Brouillard',48:'Brouillard',51:'Bruine',53:'Bruine',55:'Bruine',61:'Pluie faible',63:'Pluie',65:'Forte pluie',
  71:'Neige',73:'Neige',75:'Forte neige',80:'Averses',81:'Averses',82:'Fortes averses',95:'Orage',96:'Orage + grêle',99:'Orage + grêle'};

/* Réponse parlée vers Nexus (le HUD parent relaie au serveur local) */
function reply(text){ try{ if(parent !== window) parent.postMessage({ type:'globe_reply', text }, location.origin); }catch(_){} toast(text); }
let toastT; function toast(t){ $('toast').textContent=t; $('toast').style.display='block'; clearTimeout(toastT); toastT=setTimeout(()=>$('toast').style.display='none',4500); }
// Version app : les données viennent du serveur Dzaryx (marche PC éteint), avec le jeton de l'appareil (même origine que l'app)
const API = new URLSearchParams(location.search).get('api') || 'https://ibrahim-backend-production.up.railway.app';
const TOKEN = (() => { try { return localStorage.getItem('dz:device_token') || ''; } catch(_){ return ''; } })();
async function get(kind, params={}){
  const r = await fetch(API + '/api/nexus/globe/'+kind+'?'+new URLSearchParams(params), { headers:{ Authorization:'Bearer ' + TOKEN } });
  const j = await r.json(); if(!r.ok) throw new Error(j.error||r.status); return j;
}

/* ── Globe ── */
Cesium.Ion.defaultAccessToken = '';
const viewer = new Cesium.Viewer('globe', {
  baseLayer:false, animation:false, timeline:false, geocoder:false, homeButton:false, sceneModePicker:false, baseLayerPicker:false,
  navigationHelpButton:false, fullscreenButton:false, infoBox:false, selectionIndicator:false, requestRenderMode:false,
  skyBox:false, contextOptions:{ webgl:{ alpha:false } },
});
const scene = viewer.scene, camera = viewer.camera, globe = scene.globe;
scene.backgroundColor = Cesium.Color.fromCssColorString('#02050d');
globe.baseColor = Cesium.Color.fromCssColorString('#031228');
globe.enableLighting = false; globe.showGroundAtmosphere = true;
scene.skyAtmosphere.hueShift = -0.08; scene.skyAtmosphere.brightnessShift = 0.25;
scene.fog.enabled = false;

const esri = new Cesium.UrlTemplateImageryProvider({
  url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', maximumLevel:19,
  credit:'Esri, Maxar, Earthstar Geographics, GIS User Community' });
const labels = new Cesium.UrlTemplateImageryProvider({
  url:'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', maximumLevel:19, credit:'Esri' });
const photo = viewer.imageryLayers.addImageryProvider(esri);
// Teinte « hologramme » : la même imagerie en niveaux de gris + voile bleu
const tintCanvas = Object.assign(document.createElement('canvas'), { width:4, height:4 });
const tctx = tintCanvas.getContext('2d'); tctx.fillStyle = '#1676ff'; tctx.fillRect(0,0,4,4);
let tint = null;
Cesium.SingleTileImageryProvider.fromUrl(tintCanvas.toDataURL()).then(p => { tint = viewer.imageryLayers.addImageryProvider(p); applyView(); }).catch(()=>{});
const labelLayer = viewer.imageryLayers.addImageryProvider(labels);
function applyView(){
  const holo = state.view === 'holo';
  if(tint) tint.show = holo;
  if(holoLayer) holoLayer.show = holo;
  aurora.forEach(a => a.show = holo);
  globe.showGroundAtmosphere = false; $('ring').style.display = holo ? 'block' : 'none';
  blendHolo(); syncButtons();
}
/* Holo de loin, vraie image en couleurs de près (comme la vidéo) : fondu selon l'altitude */
const lerp = (a, b, k) => a + (b - a) * k;
function blendHolo(){
  const holo = state.view === 'holo', h = camera.positionCartographic.height;
  const k = holo ? Math.max(0, Math.min(1, (h - 500_000) / 2_500_000)) : 0;
  photo.saturation = lerp(1.1, 0, k); photo.contrast = lerp(1.05, 1.5, k); photo.brightness = lerp(1.05, .75, k); photo.gamma = lerp(1, 1.2, k);
  if(tint) tint.alpha = .5 * k;
  if(holoLayer) holoLayer.alpha = k;
  labelLayer.alpha = lerp(.9, .4, k);
}
/* Continents néon dessinés à la main (Natural Earth) : bleu nuit + côtes cyan qui brillent, comme JARVIS */
let holoLayer = null;
async function buildHolo(){
  const topo = await (await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json')).json();
  const land = topojson.feature(topo, topo.objects.land), borders = topojson.mesh(topo, topo.objects.countries, (a, b) => a !== b);
  const W = 4096, H = 2048, c = Object.assign(document.createElement('canvas'), { width:W, height:H }), g = c.getContext('2d');
  const X = lon => (lon + 180) / 360 * W, Y = lat => (90 - lat) / 180 * H;
  const sea = g.createLinearGradient(0, 0, 0, H);
  sea.addColorStop(0, '#020a1a'); sea.addColorStop(.5, '#05214a'); sea.addColorStop(1, '#020a1a');
  g.fillStyle = sea; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(90,180,255,.13)'; g.lineWidth = 1;                 // graticule tous les 15°
  for(let lon = -180; lon <= 180; lon += 15){ g.beginPath(); g.moveTo(X(lon), 0); g.lineTo(X(lon), H); g.stroke(); }
  for(let lat = -75; lat <= 75; lat += 15){ g.beginPath(); g.moveTo(0, Y(lat)); g.lineTo(W, Y(lat)); g.stroke(); }
  const trace = geom => {
    g.beginPath();
    const rings = geom.type === 'Polygon' ? [geom.coordinates] : geom.type === 'MultiPolygon' ? geom.coordinates : geom.coordinates.map(l => [l]);
    for(const poly of rings) for(const ring of poly){
      let px = null;
      ring.forEach(([lon, lat], i) => { const x = X(lon), y = Y(lat); (i === 0 || Math.abs(x - px) > W / 2) ? g.moveTo(x, y) : g.lineTo(x, y); px = x; });
    }
  };
  const fill = g.createLinearGradient(0, 0, 0, H);

/* Aurore boréale : rideau vert autour du pôle géomagnétique */
const aurora = [];
(function buildAurora(){
  const cv = Object.assign(document.createElement('canvas'), { width:512, height:128 }), g = cv.getContext('2d');
  for(let x = 0; x < 512; x++){
    const a = .25 + .75 * Math.abs(Math.sin(x * .07) * Math.sin(x * .023 + 1.3)) * (0.6 + Math.random() * .4);
    const gr = g.createLinearGradient(0, 0, 0, 128);
    gr.addColorStop(0, 'rgba(150,90,255,0)'); gr.addColorStop(.35, `rgba(120,255,190,${a * .25})`);
    gr.addColorStop(.85, `rgba(70,255,160,${a * .9})`); gr.addColorStop(1, `rgba(40,255,140,${a * .35})`);
    g.fillStyle = gr; g.fillRect(x, 0, 1, 128);
  }
  const pole = { lat:80.7, lon:-72.7 }, r = Math.PI / 180, N = 160;
  const ring = (rad) => { const pts = [], lo = [], hi = [];
    for(let i = 0; i <= N; i++){
      const brg = i / N * 2 * Math.PI, d = rad * r, la1 = pole.lat * r, lo1 = pole.lon * r;
      const la2 = Math.asin(Math.sin(la1) * Math.cos(d) + Math.cos(la1) * Math.sin(d) * Math.cos(brg));
      const lo2 = lo1 + Math.atan2(Math.sin(brg) * Math.sin(d) * Math.cos(la1), Math.cos(d) - Math.sin(la1) * Math.sin(la2));
      pts.push(lo2 / r, la2 / r); lo.push(100_000); hi.push(650_000 + 250_000 * Math.sin(i * .21) * Math.sin(i * .05));
    }
    return { pts, lo, hi }; };
  for(const [rad, alpha] of [[20, 1], [23, .6]]){
    const w = ring(rad);
    aurora.push(viewer.entities.add({ wall:{ positions:Cesium.Cartesian3.fromDegreesArray(w.pts), minimumHeights:w.lo, maximumHeights:w.hi,
      material:new Cesium.ImageMaterialProperty({ image:cv, transparent:true, repeat:new Cesium.Cartesian2(18, 1),
        color:new Cesium.CallbackProperty(() => Cesium.Color.WHITE.withAlpha(alpha * (.75 + .25 * Math.sin(Date.now() / 700 + rad))), false) }) } }));
  }
})();

function center(){

  const carto = c ? Cesium.Cartographic.fromCartesian(c) : camera.positionCartographic;

function distKm(a, b){
  const R=6371, r=Math.PI/180, dLat=(b.lat-a.lat)*r, dLon=(b.lon-a.lon)*r;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(x));
}

function pickAt(position){
  const o = scene.pick(position); const box = $('info');
  const id = o && (o.id && o.id.properties ? o.id.properties.getValue(Cesium.JulianDate.now()) : o && o.id);
  if(id && id.kind === 'cam'){ openCam(id.i, false); return; }
  if(id && id.kind === 'inflight'){ focusFlight(id.i); return; }
  box.classList.remove('pl'); planeSel = null;
  if(!id || !id.kind){ box.style.display='none'; return; }
  if(id.kind === 'plane'){ const p=id.p; box.classList.add('pl'); box.textContent = `✈️ ${p.cs||p.id} ${p.type||''} · ${p.alt.toLocaleString('fr-FR')} m · ${p.spd} km/h · cap ${Math.round(p.trk)}°`; planeCard(p); }
  else if(id.kind === 'quake'){ const q=id.q; box.textContent = `🌋 M${(q.mag??0).toFixed(1)} · ${q.place} · ${new Date(q.time).toLocaleString('fr-FR')} · ${Math.round(q.depth)} km de profondeur`; }
  else if(id.kind === 'sat'){ box.textContent = `🛰️ ${id.s.name} · ${Math.round(id.p.alt/1000)} km d'altitude`; }
  box.style.display='block';

/* Fiche complète d'un avion (Kouider 22/10 : « pas assez d'info : compagnie, départ, arrivée… ») :
   route + appareil lus directement chez adsbdb (gratuit, CORS ouvert), gardés en mémoire pour la session. */
const adsbdb = new Map(); let planeSel = null;
async function adsb(path){
  if(adsbdb.has(path)) return adsbdb.get(path);
  const v = await fetch('https://api.adsbdb.com/v0/' + path).then(r => r.ok ? r.json() : null).then(j => j && j.response).catch(() => null);
  adsbdb.set(path, v); return v;
}
const hav = (a, b, c, d) => { const r = Math.PI / 180, x = Math.sin((c - a) * r / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin((d - b) * r / 2) ** 2; return 12742 * Math.asin(Math.sqrt(x)); };
async function planeCard(p){
  const key = p.id + p.cs; planeSel = key;
  const [rt, ac] = await Promise.all([p.cs ? adsb('callsign/' + encodeURIComponent(p.cs)) : null, p.id ? adsb('aircraft/' + encodeURIComponent(p.id)) : null]);
  if(planeSel !== key) return;                    // un autre objet a été touché entre-temps
  const fr = rt && rt.flightroute, a = ac && ac.aircraft, box = $('info');
  if(!fr && !a) return;                           // inconnu : la ligne courte reste
  const ap = x => x ? `${esc(x.municipality || x.name)} <span class="dim">(${esc(x.iata_code || x.icao_code)})</span>` : '?';
  const lines = [`<div class="pc-h">✈️ <b>${esc(p.cs || p.id)}</b>${fr && fr.airline ? ` · ${esc(fr.airline.name)}` : a && a.registered_owner ? ` · ${esc(a.registered_owner)}` : ''}</div>`];
  if(fr && fr.origin && fr.destination){
    lines.push(`<div class="pc-r">${ap(fr.origin)} → ${ap(fr.destination)}</div>`);
    const tot = hav(fr.origin.latitude, fr.origin.longitude, fr.destination.latitude, fr.destination.longitude);
    const left = hav(p.lat, p.lon, fr.destination.latitude, fr.destination.longitude);
    const pct = Math.max(0, Math.min(100, Math.round((1 - left / tot) * 100)));
    const eta = p.spd > 80 ? Math.round(left / p.spd * 60) : null;
    const at = eta != null ? new Date(Date.now() + eta * 60000).toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' }) : '';
    lines.push(`<div class="pc-bar"><i style="width:${pct}%"></i></div>`,
      `<div>Reste ${Math.round(left).toLocaleString('fr-FR')} km${eta != null ? ` · arrivée vers ${at} (~${eta} min)` : ''}</div>`);
  }
  lines.push(`<div class="dim">${a ? `${esc(a.manufacturer)} ${esc(a.type)} · ${esc(a.registration)}${a.registered_owner_country_name ? ` · ${esc(a.registered_owner_country_name)}` : ''} · ` : ''}${p.alt.toLocaleString('fr-FR')} m · ${p.spd} km/h</div>`);
  if(a && a.url_photo_thumbnail) lines.push(`<img class="pc-img" src="${esc(a.url_photo_thumbnail)}" alt="" onerror="this.remove()">`);
  box.innerHTML = lines.join('');
}

/* ── Contrôle à la main (relayé par Nexus) : pincer-glisser = tourner, pincer sans bouger = clic, deux mains = zoom ── */
const gp = { x:0, y:0, moved:0 };
function gesturePtr(d){
  if(d.phase === 'down'){ gp.x = d.x; gp.y = d.y; gp.moved = 0; state.spin = false; lastUser = Date.now(); syncButtons(); return; }
  const dx = d.x - gp.x, dy = d.y - gp.y; gp.x = d.x; gp.y = d.y; gp.moved += Math.abs(dx) + Math.abs(dy);
  if(d.phase === 'move'){
    const h = camera.positionCartographic.height, k = Math.max(2e-6, Math.min(2.5e-3, h / 4e9));
    camera.rotateLeft(dx * k); camera.rotateUp(dy * k); lastUser = Date.now(); return;
  }
  if(d.phase === 'up' && gp.moved < 14){
    const el = document.elementFromPoint(d.x, d.y);
    if(el && el.tagName === 'CANVAS') pickAt(new Cesium.Cartesian2(d.x, d.y));
    else { const b = el && el.closest('button,.fl,.th'); if(b) b.click(); }
  }
}
let gHover = null;
function gestureHover(d){
  const el = document.elementFromPoint(d.x, d.y), b = el && el.closest('button,.fl,.th');
  if(b !== gHover){ if(gHover) gHover.classList.remove('ghover'); gHover = b; if(b) b.classList.add('ghover'); }
}
function gestureZoom(f){
  const h = camera.positionCartographic.height;
  if(f > 1) camera.zoomIn(h * Math.min(.5, f - 1)); else camera.zoomOut(h * Math.min(1, 1 / f - 1));
}

function afterFly(){ if(state.planes) void loadPlanes(); }   // avions de la zone dès l'arrivée
async function flyTo(query){
  try {
    const g = await get('geocode', { q:query });
    if(!g.found){ reply(`Je ne trouve pas ${query}.`); return; }
    state.spin = false; syncButtons();
    const [s,n,w,e] = g.bbox || [];
    const big = g.bbox && (n-s > 0.3 || e-w > 0.3);
    if(big) camera.flyTo({ destination:Cesium.Rectangle.fromDegrees(w, s, e, n), duration:3, complete:afterFly });
    else camera.flyTo({ destination:Cesium.Cartesian3.fromDegrees(g.lon, g.lat, 25_000), duration:3, complete:afterFly });
    setTimeout(() => refreshWeather(true), 3300);
  } catch(e){ reply('Recherche du lieu impossible : '+e.message); }
}
function zoom(dir){
  const h = camera.positionCartographic.height;
  dir === 'in' ? camera.zoomIn(h*0.55) : camera.zoomOut(h*1.2);
}
function events(){
  const c = center(), radius = Math.max(300, Math.min(2500, c.h/1000));
  const near = data.quakes.length ? data.quakes : null;
  const go = list => {
    const q = list.filter(x => distKm(c, x) <= radius && Date.now() - x.time < 7*86400e3).sort((a,b) => b.mag - a.mag);
    const zone = placeName || 'cette zone';
    const parts = [q.length ? `${q.length} séisme${q.length>1?'s':''} cette semaine autour de ${zone}, le plus fort M${q[0].mag.toFixed(1)} ${q[0].place}.` : `Aucun séisme récent autour de ${zone}.`];
    if(state.planes) parts.push(`${data.planes.length} avions en vol dans le secteur.`);
    if(wxData) parts.push(`Il fait ${wxData.temp} degrés, ${WX[wxData.code] ? WX[wxData.code].toLowerCase() : ''}.`);
    reply(parts.join(' '));
  };
  if(near) go(near); else get('quakes').then(r => { data.quakes = r.quakes || []; go(data.quakes); }).catch(e => reply('Données indisponibles : '+e.message));
}
let booted = false;   // le 1er « open » arrive pendant l'intro de chargement
function command(d){
  switch(d.action){
    case 'open': if(booted) playIntro(1400); booted = true; break;
    case 'spin': state.spin = !!d.on; lastUser = 0; syncButtons(); break;
    case 'view': state.view = d.mode === 'satellite' ? 'satellite' : 'holo'; applyView(); break;
    case 'fly': void flyTo(d.query); break;
    case 'zoom': zoom(d.dir); break;
    case 'home': camera.flyTo({ destination:HOME, duration:2 }); break;
    case 'events': events(); break;
    case 'layer': setLayer(d.name, !!d.on); break;
    case 'inbound': void showInbound(d.query, d.mode); break;
    case 'inbound_close': closeInbound(); break;
    case 'cams': void showCams(d.query); break;
    case 'cam_next': openCam(cams.i + 1, true); break;
    case 'cam_prev': openCam(cams.i - 1, true); break;
    case 'cam_size': $('cam').classList.toggle('big', !!d.big); break;
    case 'cam_close': closeCamView(); break;
    case 'cams_world': void showWorld(); break;
    case 'cam_close_all': closeCams(); break;
    case 'cams_strip': void showStrip(d.cat, d.query, false); break;
    case 'g_ptr': gesturePtr(d); break;

/* ── Recherche + actions (version app) ── */
const qv = () => $('q').value.trim();
$('go').onclick = () => { if(qv()) { $('q').blur(); void flyTo(qv()); } };
$('q').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); $('go').click(); } });
document.querySelectorAll('#acts button').forEach(b => b.onclick = () => {
  const a = b.dataset.a, place = qv() || (a === 'in' || a === 'out' ? 'Oran' : '');
  $('q').blur();
  if(a === 'in' || a === 'out') void showInbound(place, a);
  else if(a === 'cams') void showCams(place);
  else if(a === 'world') void showWorld();
  else if(a === 'strip') void showStrip('all', place, false);
  else if(a === 'events') events();
});
applyView(); tick(); void refreshWeather(true);
</script>
