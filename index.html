    <style>
      :root {
        /* Core palette */
        --bg-base:    #000000;
        --bg-deep:    #050816;
        --bg-surface: #07111f;

        --border-subtle:  rgba(0,212,255,0.08);

        --font-display: 'Orbitron', monospace;

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body, #root {
        width: 100%; height: 100%;
        background: #000;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* ── Scrollbars ─────────────────────────────────────────── */
      ::-webkit-scrollbar { width: 0; height: 0; }

      /* ── Global animations ──────────────────────────────────── */
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.4; }
      }
      @keyframes glow-pulse {
        0%, 100% { box-shadow: 0 0 12px var(--cyan-glow); }
        50%       { box-shadow: 0 0 28px var(--cyan-glow), 0 0 50px rgba(0,212,255,0.15); }
      }
      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes spin-rev {
        from { transform: rotate(360deg); }
        to   { transform: rotate(0deg); }
      }
      @keyframes halo-breathe {
        0%, 100% { transform: translate(-50%,-50%) scale(1);   opacity: 0.6; }
        50%       { transform: translate(-50%,-50%) scale(1.06); opacity: 1; }
      }
      @keyframes ring-expand {
        0%   { transform: translate(-50%,-50%) scale(0.9); opacity: 0.7; }
        100% { transform: translate(-50%,-50%) scale(1.4); opacity: 0; }
      }
      @keyframes listening-wave {
        0%, 100% { transform: scaleY(0.3); }
        50%       { transform: scaleY(1); }
      }
      @keyframes msg-in {
        from { opacity: 0; transform: translateY(6px) scale(0.98); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes statusPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%       { opacity: 0.5; transform: scale(0.85); }
      }
      @keyframes neonPulse {
        0%, 100% { box-shadow: 0 0 16px var(--cyan-glow), 0 0 32px rgba(0,212,255,0.15); }
        50%       { box-shadow: 0 0 30px var(--cyan-glow), 0 0 60px rgba(0,212,255,0.25); }
      }
      @keyframes scanline-move {
        0%   { transform: translateY(-100%); }
        100% { transform: translateY(100vh); }
      }
      @keyframes shimmer {
        0%   { background-position: -200% center; }
        100% { background-position: 200% center; }
      }

      /* ── Scanlines overlay ──────────────────────────────────── */
      .scanlines::before {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0,0,0,0.03) 2px,
          rgba(0,0,0,0.03) 4px

      /* ── Glass card ─────────────────────────────────────────── */

  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        // Auto-reload quand une nouvelle version du SW prend le contrôle → plus besoin
        // de fermer/rouvrir l'app à la main pour voir les mises à jour.
        let _swReloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (_swReloaded) return; _swReloaded = true;
          window.location.reload();
        });
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/ibrahim/sw.js', { scope: '/ibrahim/' })
            .then(reg => {
              // Vérifie les mises à jour périodiquement (app longtemps ouverte).
              setInterval(() => { reg.update().catch(() => {}); }, 60000);
            })
            .catch(() => { /* SW optional — app still works offline via manifest cache */ });
        });
      }
    </script>
